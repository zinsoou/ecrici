    if(dg.length>=8){ $("qa").innerHTML=`<a class="wa" href="https://wa.me/${dg}?text=${encodeURIComponent(tx.hi2+" "+D.name)}" rel="noopener">${SV.wa}${esc(tx.wa)}</a><a class="ca" href="tel:+${dg}">${SV.ph}${esc(tx.call)}</a>`; $("qa").hidden=false; }
    const sn=D._c?new Date(D._c).toLocaleDateString(lg==="fr"?"fr-FR":"en-GB",{month:"short",year:"numeric"}):"", ch=[];
    if(D.hrs) ch.push(SV.clock+esc(tx.hrsl+": "+D.hrs)); if(D.addr) ch.push(SV.pin+esc(D.addr));
    if(D._u){ const n=Math.floor((Date.now()-new Date(D._u))/864e5); const w=n<=0?tx.td:n===1?tx.yd:n<45?tx.dg.replace("{n}",n):tx.dm.replace("{n}",Math.round(n/30)); ch.push(SV.up+esc(tx.upd+": "+w)); }
    if(sn) ch.push(esc(tx.since+" "+sn));
    $("chp").innerHTML=ch.map(x=>`<span>${x}</span>`).join(""); }
  const its=D.items||[]; const lab=(D.lab||[])[lg==="fr"?0:1]||"";
  if(!its.length){ $("m").innerHTML=`<div class="msg">${esc(tx.empty)}</div>`; return; }
  $("m").innerHTML=`${(D.gal||[]).filter(okU).length?`<div class="gl" id="gl">${(D.gal||[]).filter(okU).slice(0,8).map((u,i)=>`<img loading="lazy" alt="" src="${esc(u)}" data-gi="${i}">`).join("")}</div>`:""}<h2>${esc(lab)}</h2><div class="tabs" id="tb" hidden></div>${its.length>8?`<input class="s" id="q" placeholder="${esc(tx.srch)}" autocomplete="off">`:""}<div id="l"></div><div class="sf">⚠ ${esc(tx.safe)}</div><div class="fm" id="fm"></div>
  <div class="pw">${esc(tx.pw)} <a href="https://ecrici.com/" target="_blank" rel="noopener">Ecrici</a><div class="pl"><a href="https://ecrici.com/" target="_blank" rel="noopener">${esc(tx.mk)}</a><a href="/market.html">${esc(tx.mkt)}</a><a href="/terms.html">${esc(tx.tm)}</a><a href="/privacy.html">${esc(tx.pv)}</a></div></div>
  <div class="rp" id="rp"></div><div class="bar"><div class="w"><button class="go" id="go" disabled><span>${esc(tx.send)}</span><span id="tt"></span></button><p class="hint">${esc(tx.hint)}</p></div></div>`;
  const cats=[...new Set(its.map(x=>x.c).filter(Boolean))];
  if(cats.length){ const un=its.some(x=>!x.c); const all=[["",tx.all]].concat(cats.map(c=>[c,c])).concat(un?[["~other",tx.oth]]:[]); $("tb").hidden=false;
    $("tb").innerHTML=all.map(([k,l])=>`<button data-c="${esc(k)}" aria-pressed="${k===cat}">${esc(l)}</button>`).join("");
    $("tb").addEventListener("click",e=>{const b=e.target.closest("button[data-c]");if(!b)return;cat=b.dataset.c;[...$("tb").children].forEach(z=>z.setAttribute("aria-pressed",z===b));list();}); }
  if($("q")) $("q").addEventListener("input",list);
  $("l").addEventListener("click",e=>{const b=e.target.closest("button[data-i]");if(!b)return;const i=+b.dataset.i,d=+b.dataset.d;Q[i]=Math.max(0,Math.min(99,(Q[i]||0)+d));if(!Q[i])delete Q[i];list();});
  form(); $("go").addEventListener("click",send); list();
  $("l").addEventListener("click",e=>{const z=e.target.closest("[data-g]");if(!z)return;const cs=z.querySelector(".cs"), k=cs?Math.round(cs.scrollLeft/Math.max(1,cs.clientWidth)):0; openGal(imgs(D.items[+z.dataset.g]),k);});
  $("l").addEventListener("scroll",e=>{const c=e.target; if(c.classList&&c.classList.contains("cs")){ const k=Math.round(c.scrollLeft/Math.max(1,c.clientWidth)); c.parentNode.querySelectorAll(".cdt i").forEach((d,j)=>d.classList.toggle("on",j===k)); }},true);
  if($("gl")) $("gl").addEventListener("click",e=>{const z=e.target.closest("img[data-gi]");if(z)openGal((D.gal||[]).filter(okU).slice(0,8),+z.dataset.gi);});
  $("rp").innerHTML=`<button id="rb">${esc(tx.rep)}</button>`;$("rb").onclick=report;
}
const FM={
 hotel:[{k:"d1",t:"date",fr:"Arrivée",en:"Check-in",req:1},{k:"d2",t:"date",fr:"Départ",en:"Check-out",req:1},{k:"g",t:"number",fr:"Nombre de personnes",en:"Number of guests"}],
 beauty:[{k:"d1",t:"date",fr:"Jour souhaité",en:"Preferred day"},{k:"tm",t:"time",fr:"Heure souhaitée",en:"Preferred time"}],
 health:[{k:"d1",t:"date",fr:"Jour souhaité",en:"Preferred day"},{k:"tm",t:"time",fr:"Heure souhaitée",en:"Preferred time"}],
 travel:[{k:"d1",t:"date",fr:"Date de voyage",en:"Travel date"},{k:"g",t:"number",fr:"Nombre de voyageurs",en:"Number of travellers"}],
 rent:[{k:"d1",t:"date",fr:"Jour de visite souhaité",en:"Preferred viewing day"},{k:"n",t:"area",fr:"Précisions (facultatif)",en:"Details (optional)"}],
 repair:[{k:"dv",t:"text",fr:"Appareil ou objet à réparer",en:"Device or item to repair"},{k:"n",t:"area",fr:"Quel est le problème ?",en:"What is the problem?"}],
 school:[{k:"st",t:"text",fr:"Nom de l'élève ou de l'étudiant",en:"Student name"}],
 services:[{k:"d1",t:"date",fr:"Jour souhaité (facultatif)",en:"Preferred day (optional)"},{k:"n",t:"area",fr:"Précisions (facultatif)",en:"Details (optional)"}]
};
const DELIV={t:"sel",k:"dl",fr:"Retrait ou livraison",en:"Pickup or delivery",o:[["Retrait sur place","Pickup"],["Livraison","Delivery"]]};
["shop","electronics","food"].forEach(b=>FM[b]=[DELIV,{k:"ad",t:"text",fr:"Adresse de livraison",en:"Delivery address",ifd:1}]);
const BOOK=["hotel","beauty","health","travel","rent"], NOTOT=["hotel","rent"];
const fields=()=>FM[D.biz]||[];
function form(){
  const today=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
  $("fm").innerHTML=`<h3>${esc(tx.det)}</h3><label>${esc(tx.name)}<input id="cn" maxlength="60" autocomplete="name"></label>`+fields().map(f=>{ const lb=esc(lg==="fr"?f.fr:f.en), id="f_"+f.k, w=f.ifd?' data-ifd="1" hidden':"";
    if(f.t==="sel") return `<label>${lb}<select id="${id}">${f.o.map((o,i)=>`<option value="${i}">${esc(o[lg==="fr"?0:1])}</option>`).join("")}</select></label>`;
    if(f.t==="area") return `<label${w}>${lb}<textarea id="${id}" rows="2" maxlength="300"></textarea></label>`;
    return `<label${w}>${lb}<input id="${id}" type="${f.t}" ${f.t==="date"?'min="'+today+'"':""} ${f.t==="number"?'min="1" max="99" inputmode="numeric"':'maxlength="120"'}></label>`; }).join("")+`<p class="fe" id="fe" hidden></p>`;
  const dl=$("f_dl"); if(dl) dl.onchange=()=>{ document.querySelectorAll("#fm [data-ifd]").forEach(e=>e.hidden=dl.value!=="1"); };
  $("go").firstElementChild.textContent=BOOK.includes(D.biz)?tx.book:tx.send;
}
function fm(n,l){ l=l||lg; const c=D.cur||["",0,0]; const num=new Intl.NumberFormat(l==="fr"?"fr-FR":"en-NG",{maximumFractionDigits:c[2]}).format(n).replace(/[\u00a0\u202f]/g," "); return c[1]?num+" "+c[0]:c[0]+" "+num; }
function list(){
  const q=($("q")?$("q").value:"").trim().toLowerCase(); let g="",v="";
  const ord=D.items.map((x,i)=>i).sort((a,b)=>(D.items[b].x?1:0)-(D.items[a].x?1:0)||a-b);
  ord.forEach(i=>{ const x=D.items[i]; if(q&&!x.n.toLowerCase().includes(q)) return; if(cat==="~other"?x.c:cat&&x.c!==cat) return; const n=Q[i]||0;
    const im=imgs(x), ctl=x.a?(n?`<div class="q"><button data-i="${i}" data-d="-1" aria-label="-1">−</button><i>${n}</i><button data-i="${i}" data-d="1" aria-label="+1">+</button></div>`:`<button class="add" data-i="${i}" data-d="1">${esc(tx.add)}</button>`):`<span class="outl">${esc(tx.out)}</span>`;
    const pr=x.p>0?`<div class="pr2">${esc(x.f)}</div>`:"";
    if(VIS.includes(D.biz)&&im.length){
      v+=`<div class="cd"><div class="cp" data-g="${i}"><div class="cs">${im.map(u=>`<img loading="lazy" decoding="async" alt="" src="${esc(u)}">`).join("")}</div>${im.length>1?`<span class="cn">📷 ${im.length}</span><div class="cdt">${im.map((_,j)=>`<i${j?"":` class="on"`}></i>`).join("")}</div>`:""}</div><div class="cb"><div class="n"><b>${esc(x.n)}${x.x?`<span class="pr">${esc(tx.promo)}</span>`:""}</b><span>${x.p>0?esc(x.f):""}</span>${x.d?`<em class="ds">${esc(x.d)}</em>`:""}</div>${ctl}</div></div>`; }
    else g+=`<div class="pc${x.a?"":" so"}"><div class="im"${im.length?` data-g="${i}"`:""}>${im.length?thImg(im[0],x.n):`<div class="ph">${esc((x.n||"?").trim().slice(0,1).toUpperCase())}</div>`}${x.a?"":`<span class="bd so">${esc(tx.out)}</span>`}${x.x&&x.a?`<span class="bd pr">${esc(tx.promo)}</span>`:""}${im.length>1?`<i class="mb">📷 ${im.length}</i>`:""}</div><div class="b"><div class="n">${esc(x.n)}</div>${x.d?`<em class="ds">${esc(x.d)}</em>`:""}${pr}<div class="ct">${ctl}</div></div></div>`; });
  $("l").innerHTML=(v||"")+(g?`<div class="pg">${g}</div>`:"")||`<div class="msg">${esc(tx.none)}</div>`;
  let c=0,tot=0;Object.keys(Q).forEach(k=>{c+=Q[k];tot+=Q[k]*D.items[k].p;});
  $("go").disabled=!c; $("tt").textContent=c?(tot>0&&!NOTOT.includes(D.biz)?tx.total+" "+fm(tot):"×"+c):"";
}
function send(){
  const ls=Object.keys(Q).map(k=>{const it=D.items[k];return "• "+Q[k]+" × "+it.n+(it.p>0&&!NOTOT.includes(D.biz)?" ("+fm(Q[k]*it.p,sl)+")":"");});if(!ls.length)return;
  let tot=0;Object.keys(Q).forEach(k=>tot+=Q[k]*D.items[k].p);const nm=$("cn").value.trim(), fe=$("fe"); fe.hidden=true;
  const ex=[]; const dl=$("f_dl");
  for(const f of fields()){ const el=$("f_"+f.k); if(!el) continue; if(f.ifd&&dl&&dl.value!=="1") continue; let v=el.value.trim(); if(!v) continue;
    if(f.t==="sel") v=f.o[+v][sl==="fr"?0:1]; if(f.t==="date") v=new Date(v+"T12:00").toLocaleDateString(sl==="fr"?"fr-FR":"en-GB",{day:"numeric",month:"short",year:"numeric"}); ex.push((sl==="fr"?f.fr:f.en).replace(/\s*\(.*\)$/,"")+": "+v); }
  if(D.biz==="hotel"){ const a=$("f_d1").value, b=$("f_d2").value; if(!a||!b||b<=a){ fe.textContent=tx.e1; fe.hidden=false; $("fm").scrollIntoView({block:"center"}); return; } }
  const bk=BOOK.includes(D.biz);
  const sx=T[sl]; const text=sx.hi+" "+D.name+", "+(bk?sx.askB:sx.ask)+"\n"+ls.join("\n")+(tot>0&&!NOTOT.includes(D.biz)?"\n"+sx.total+": "+fm(tot,sl):"")+(ex.length?"\n"+ex.join("\n"):"")+(nm?"\n"+sx.nm+" "+nm:"");
  location.href="https://wa.me/"+String(D.phone||"").replace(/\D/g,"")+"?text="+encodeURIComponent(text);
}
function report(){
  $("rp").innerHTML=`<div class="rs"><b>${esc(tx.why)}</b>${[1,2,3,4].map(n=>`<button data-r="${n}">${esc(tx["r"+n])}</button>`).join("")}</div>`;
  $("rp").onclick=async e=>{const b=e.target.closest("button[data-r]");if(!b)return;const why=tx["r"+b.dataset.r];$("rp").onclick=null;
    try{await fetch(String(ECRICI.url).replace(/\/+$/,"")+"/rest/v1/catalog_reports",{method:"POST",headers:{apikey:ECRICI.key,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({slug:slug,reason:why})});}catch(_){}
    $("rp").innerHTML=esc(tx.thx);};
}
