<style>

.w{max-width:640px;margin:0 auto;padding:0 16px}header .w{padding:0}

main.w{padding:16px 16px 150px}.fm{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:6px 0 12px;display:grid;gap:10px}.fm h3{margin:0;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}.fm label{display:grid;gap:4px;font-size:14px;color:var(--mut)}.fm input,.fm select,.fm textarea{padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;width:100%}.fe{color:var(--warn);font-size:14px;margin:0}.up{margin:6px 0 0;color:#C9D3F5;font-size:12px}

.s{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin-bottom:12px}
.it{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}

.q button.p{background:var(--acc);border-color:var(--acc);color:#fff}.q i{min-width:20px;text-align:center;font-style:normal;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px rgba(14,26,79,.12)}
.bar .w{padding:0;display:grid;gap:8px}.bar input{padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;width:100%}
.go{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:14px 18px;border:0;border-radius:14px;background:var(--wa);color:#fff;font:inherit;font-weight:750;font-size:17px;cursor:pointer}
.go[disabled]{opacity:.45;cursor:default}
.hint{text-align:center;color:var(--mut);font-size:13px;margin:0}
.msg{text-align:center;padding:64px 16px;color:var(--mut)}.msg b{display:block;font-size:20px;color:var(--ink);margin-bottom:6px}
.im{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--line);flex:none;cursor:zoom-in}.lb{position:fixed;inset:0;background:rgba(5,8,25,.88);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}.lb img{max-width:100%;max-height:100%;border-radius:14px}
.rp{text-align:center;font-size:12px;color:var(--mut);padding:0 0 10px}.rp button{background:none;border:0;color:var(--mut);text-decoration:underline;font:inherit;cursor:pointer;padding:4px}.rs{display:grid;gap:6px;max-width:320px;margin:8px auto}.rs button{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer;text-decoration:none}
.pw{text-align:center;font-size:13px;color:var(--mut);padding:18px 0 4px}.pw a{color:var(--acc);font-weight:700;text-decoration:none}.pl{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px;margin-top:6px}.pl a{white-space:nowrap}.fm input,.fm select,.fm textarea{min-height:46px}

header{position:relative}.sh{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;backdrop-filter:blur(4px)}
.it,.fm,.cd{box-shadow:0 1px 2px rgba(14,26,79,.04),0 8px 22px rgba(14,26,79,.06)}
.imw{position:relative;flex:none;display:block}.mb{position:absolute;right:-4px;bottom:-4px;background:var(--hd,#0E1A4F);color:#fff;font:600 11px/1 system-ui;border-radius:99px;padding:3px 6px;font-style:normal;border:2px solid var(--card)}
.cd{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:14px}.cp{position:relative;aspect-ratio:16/10;background:var(--line);cursor:zoom-in}.cs{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.cs::-webkit-scrollbar{display:none}.cs img{flex:none;width:100%;height:100%;object-fit:cover;display:block;scroll-snap-align:center}.cdt{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:6px;pointer-events:none}.cdt i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55)}.cdt i.on{background:#fff}.ds{display:block;font-style:normal;color:var(--mut);font-size:13px;margin-top:3px;overflow-wrap:anywhere}.cn{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:600;border-radius:99px;padding:4px 10px}
.cb{display:flex;gap:12px;align-items:center;padding:12px 14px}.cb .n{flex:1;min-width:0}.cb .n b{display:block;font-weight:700;font-size:17px;overflow-wrap:anywhere}.cb .n span{color:var(--mut);font-size:15px}
.gl{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px;scrollbar-width:none;scroll-snap-type:x proximity}.gl img{flex:none;width:132px;height:92px;object-fit:cover;border-radius:14px;background:var(--line);scroll-snap-align:start;cursor:zoom-in}
.lb2{position:fixed;inset:0;background:#050819;z-index:20;display:flex;flex-direction:column}.gs{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.gp{flex:none;width:100%;height:100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;padding:56px 12px 70px}.gp img{max-width:100%;max-height:100%;border-radius:12px;object-fit:contain}
.gx{position:absolute;top:12px;right:12px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:26px;line-height:1;cursor:pointer}.gd{position:absolute;bottom:26px;left:0;right:0;display:flex;justify-content:center;gap:7px}.gd i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35)}.gd i.on{background:#fff}
.gn{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:26px;cursor:pointer}.gn.l{left:8px}.gn.r{right:8px}@media(hover:none){.gn{display:none}}
@media(prefers-color-scheme:dark){.sf{background:#33270E;border-color:#5A4318;color:#F2D9A4}.it,.fm,.cd{box-shadow:none}}
</style>
</head>

en:{nf:"Page not found",nfs:"This link does not exist or has been turned off.",srch:"Search…",out:"Sold out",name:"Your name (optional)",send:"Send on WhatsApp",total:"Total",pick:"Choose at least one item",hi:"Hello",ask:"I would like to order:",nm:"My name:",pw:"Page made with",mk:"Make yours, 7 days free",hint:"You will send your order straight to the seller on WhatsApp.",err:"Could not load the page. Check your connection.",none:"No items found.",empty:"This page has no items yet.",book:"Book on WhatsApp",askB:"I would like to book:",det:"Your details",upd:"Prices updated",td:"today",yd:"yesterday",dg:"{n} days ago",dm:"{n} months ago",e1:"Choose check-in and check-out dates (check-out after check-in).",all:"All",oth:"Other",promo:"Promo",hrsl:"Hours",mkt:"Browse more shops",rep:"Report this page",why:"Why?",r1:"Scam or fake seller",r2:"Illegal or dangerous items",r3:"Offensive content",r4:"Other",thx:"Thank you. We will review this page.",ver:"Verified by Ecrici",share:"Share",copied:"Link copied",ph:"Photos",since:"On Ecrici since",safe:"Ecrici does not handle payments. Don't pay before you see the item or get the service, and be careful with sellers you don't know."}};
let D=null,Q={},lg="en",tx=T.en,cat="";
const slug=((new URLSearchParams(location.search).get("s"))||((location.pathname.match(/^\/s\/([^\/]+)/)||[])[1])||"").toLowerCase().replace(/[^a-z0-9-]/g,"").slice(0,30);
const dl=(navigator.language||"en").slice(0,2)==="fr"?"fr":"en";
function msg(b,s){ $("m").innerHTML=`<div class="msg"><b>${esc(b)}</b>${esc(s||"")}</div>`; }
async function load(){
  tx=T[dl];
  if(!slug){ msg(tx.nf,tx.nfs); return; }
  try{
    const base=String(ECRICI.url).replace(/\/+$/,"")+"/rest/v1/catalogs?slug=eq."+slug+"&active=eq.true&select=";
    let r=await fetch(base+"data,updated_at,verified,created_at",{headers:{apikey:ECRICI.key}});
    if(!r.ok) r=await fetch(base+"data,updated_at",{headers:{apikey:ECRICI.key}});
    if(!r.ok) throw 0; const j=await r.json();
    if(!j.length){ msg(tx.nf,tx.nfs); return; }
    D=j[0].data; D._u=j[0].updated_at; D._v=j[0].verified===true; D._c=j[0].created_at||""; lg=D.lang==="fr"?"fr":"en"; tx=T[lg]; document.documentElement.lang=lg; draw();
  }catch(e){ msg(tx.err); }
}
const okU=u=>/^https:\/\//.test(u||"")||/^http:\/\/localhost/.test(u||"");
const imgs=x=>[x.i].concat(x.g||[]).filter(okU).slice(0,5);
const VIS=["hotel","rent","travel","food","beauty"];
function openGal(list,st){ if(!list.length) return; const o=document.createElement("div"); o.className="lb2"; o.setAttribute("role","dialog");
  o.innerHTML='<div class="gs">'+list.map(()=>'<div class="gp"><img alt=""></div>').join("")+'</div><button class="gx" aria-label="Close">×</button>'+(list.length>1?'<div class="gd">'+list.map(()=>'<i></i>').join("")+'</div><button class="gn l" aria-label="Previous">‹</button><button class="gn r" aria-label="Next">›</button>':"");
  const gs=o.querySelector(".gs"), im=o.querySelectorAll(".gp img"), dots=o.querySelectorAll(".gd i"); im.forEach((e,i)=>e.src=list[i]);
  const cur=()=>Math.round(gs.scrollLeft/Math.max(1,gs.clientWidth)); const mark=()=>{ const c=cur(); dots.forEach((d,i)=>d.classList.toggle("on",i===c)); };
  const close=()=>{ o.remove(); document.body.style.overflow=""; document.removeEventListener("keydown",key); };
  const go=d=>gs.scrollTo({left:Math.max(0,Math.min(list.length-1,cur()+d))*gs.clientWidth,behavior:"smooth"});
  const key=e=>{ if(e.key==="Escape") close(); else if(e.key==="ArrowRight") go(1); else if(e.key==="ArrowLeft") go(-1); };
  o.addEventListener("click",e=>{ if(e.target.closest(".gx")||e.target.classList.contains("gp")||e.target.classList.contains("gs")) close(); else if(e.target.closest(".gn.l")) go(-1); else if(e.target.closest(".gn.r")) go(1); });
  gs.addEventListener("scroll",mark,{passive:true}); document.addEventListener("keydown",key); document.body.style.overflow="hidden"; document.body.appendChild(o);
  gs.scrollLeft=(st||0)*gs.clientWidth; mark(); }
async function share(){ const u=location.href.split("#")[0]; try{ if(navigator.share){ await navigator.share({title:D.name,url:u}); return; } }catch(e){ if(e&&e.name==="AbortError") return; }
  try{ await navigator.clipboard.writeText(u); $("sh").textContent=tx.copied; setTimeout(()=>$("sh").textContent="↗ "+tx.share,1800); }catch(e){ prompt(tx.share,u); } }
function draw(){
  document.title=D.name; $("nm").textContent=D.name; $("sh").textContent="↗ "+tx.share; $("sh").hidden=false; $("sh").onclick=share;
  if(/^#[0-9a-f]{6}$/i.test(D.col||"")){ document.documentElement.style.setProperty("--hd",D.col); document.querySelector('meta[name=theme-color]').content=D.col; }
  const ok=u=>/^https:\/\//.test(u||"")||/^http:\/\/localhost/.test(u||"");
  if(ok(D.logo)){ $("lgo").src=D.logo; $("lgo").hidden=false; }
  if(ok(D.cover)){ $("hd").style.backgroundImage="linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.6)),url('"+encodeURI(D.cover).replace(/'/g,"%27")+"')"; }
  if(D.hrs){ $("hr").textContent=tx.hrsl+": "+D.hrs; $("hr").hidden=false; }
  if(D._u){ const n=Math.floor((Date.now()-new Date(D._u))/864e5); const w=n<=0?tx.td:n===1?tx.yd:n<45?tx.dg.replace("{n}",n):tx.dm.replace("{n}",Math.round(n/30)); $("up").textContent=tx.upd+": "+w; $("up").hidden=false; }
  if(D._v){ const b=document.createElement("div"); b.className="vb"; b.textContent="✔ "+tx.ver; $("nm").parentNode.insertBefore(b,$("tg")); }
  { const dg=String(D.phone||"").replace(/\D/g,""), sn=D._c?new Date(D._c).toLocaleDateString(lg==="fr"?"fr-FR":"en-GB",{month:"short",year:"numeric"}):"";
    const bits=[]; if(dg.length>=8) bits.push("WhatsApp +"+dg); if(sn) bits.push(tx.since+" "+sn);
    if(bits.length){ $("ph").textContent=bits.join(" · "); $("ph").hidden=false; } }
  if(D.tag){ $("tg").textContent=D.tag; $("tg").hidden=false; } if(D.addr){ $("ad").textContent=D.addr; $("ad").hidden=false; }

  if(!its.length){ $("m").innerHTML=`<div class="msg">${esc(tx.empty)}</div>`; return; }
  $("m").innerHTML=`${(D.gal||[]).filter(okU).length?`<div class="gl" id="gl">${(D.gal||[]).filter(okU).slice(0,8).map((u,i)=>`<img loading="lazy" alt="" src="${esc(u)}" data-gi="${i}">`).join("")}</div>`:""}<h2>${esc(lab)}</h2><div class="tabs" id="tb" hidden></div>${its.length>8?`<input class="s" id="q" placeholder="${esc(tx.srch)}" autocomplete="off">`:""}<div id="l"></div><div class="sf">⚠ ${esc(tx.safe)}</div><div class="fm" id="fm"></div>

  <div class="rp" id="rp"></div><div class="bar"><div class="w"><button class="go" id="go" disabled><span>${esc(tx.send)}</span><span id="tt"></span></button><p class="hint">${esc(tx.hint)}</p></div></div>`;
  const cats=[...new Set(its.map(x=>x.c).filter(Boolean))];
  if(cats.length){ const un=its.some(x=>!x.c); const all=[["",tx.all]].concat(cats.map(c=>[c,c])).concat(un?[["~other",tx.oth]]:[]); $("tb").hidden=false;
    $("tb").innerHTML=all.map(([k,l])=>`<button data-c="${esc(k)}" aria-pressed="${k===cat}">${esc(l)}</button>`).join("");
    $("tb").addEventListener("click",e=>{const b=e.target.closest("button[data-c]");if(!b)return;cat=b.dataset.c;[...$("tb").children].forEach(z=>z.setAttribute("aria-pressed",z===b));list();}); }

  $("l").addEventListener("click",e=>{const b=e.target.closest("button[data-i]");if(!b)return;const i=+b.dataset.i,d=+b.dataset.d;Q[i]=Math.max(0,Math.min(99,(Q[i]||0)+d));if(!Q[i])delete Q[i];list();});

}

const DELIV={t:"sel",k:"dl",fr:"Retrait ou livraison",en:"Pickup or delivery",o:[["Retrait sur place","Pickup"],["Livraison","Delivery"]]};
["shop","electronics","pharmacy","food"].forEach(b=>FM[b]=[DELIV,{k:"ad",t:"text",fr:"Adresse de livraison",en:"Delivery address",ifd:1}]);
const BOOK=["hotel","beauty","health","travel","rent"], NOTOT=["hotel","rent"];
const fields=()=>FM[D.biz]||[];
function form(){
  const today=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
  $("fm").innerHTML=`<h3>${esc(tx.det)}</h3><label>${esc(tx.name)}<input id="cn" maxlength="60" autocomplete="name"></label>`+fields().map(f=>{ const lb=esc(lg==="fr"?f.fr:f.en), id="f_"+f.k, w=f.ifd?' data-ifd="1" hidden':"";
    if(f.t==="sel") return `<label>${lb}<select id="${id}">${f.o.map((o,i)=>`<option value="${i}">${esc(o[lg==="fr"?0:1])}</option>`).join("")}</select></label>`;
    if(f.t==="area") return `<label${w}>${lb}<textarea id="${id}" rows="2" maxlength="300"></textarea></label>`;
    return `<label${w}>${lb}<input id="${id}" type="${f.t}" ${f.t==="date"?'min="'+today+'"':""} ${f.t==="number"?'min="1" max="99" inputmode="numeric"':'maxlength="120"'}></label>`; }).join("")+`<p class="fe" id="fe" hidden></p>`;
  const dl=$("f_dl"); if(dl) dl.onchange=()=>{ document.querySelectorAll("#fm [data-ifd]").forEach(e=>e.hidden=dl.value!=="1"); };
  $("go").firstElementChild.textContent=BOOK.includes(D.biz)?tx.book:tx.send;
}
function fm(n){ const c=D.cur||["",0,0]; const num=new Intl.NumberFormat(lg==="fr"?"fr-FR":"en-NG",{maximumFractionDigits:c[2]}).format(n).replace(/[\u00a0\u202f]/g," "); return c[1]?num+" "+c[0]:c[0]+" "+num; }
function list(){
  const q=($("q")?$("q").value:"").trim().toLowerCase(); let h="";
  const ord=D.items.map((x,i)=>i).sort((a,b)=>(D.items[b].x?1:0)-(D.items[a].x?1:0)||a-b);
  ord.forEach(i=>{ const x=D.items[i]; if(q&&!x.n.toLowerCase().includes(q)) return; if(cat==="~other"?x.c:cat&&x.c!==cat) return; const n=Q[i]||0;
    const im=imgs(x), ctl=x.a?`<div class="q">${n?`<button data-i="${i}" data-d="-1" aria-label="-1">−</button><i>${n}</i>`:""}<button class="p" data-i="${i}" data-d="1" aria-label="+1">+</button></div>`:`<span class="out">${esc(tx.out)}</span>`;
    const nm=`<div class="n"><b>${esc(x.n)}${x.x?`<span class="pr">${esc(tx.promo)}</span>`:""}</b><span>${x.p>0?esc(x.f):""}</span>${x.d?`<em class="ds">${esc(x.d)}</em>`:""}</div>`;
    if(VIS.includes(D.biz)&&im.length) h+=`<div class="cd"><div class="cp" data-g="${i}"><div class="cs">${im.map(u=>`<img loading="lazy" alt="" src="${esc(u)}">`).join("")}</div>${im.length>1?`<span class="cn">📷 ${im.length}</span><div class="cdt">${im.map((_,j)=>`<i${j?"":` class="on"`}></i>`).join("")}</div>`:""}</div><div class="cb">${nm}${ctl}</div></div>`;
    else h+=`<div class="it">${im.length?`<span class="imw" data-g="${i}"><img class="im" loading="lazy" alt="" src="${esc(im[0])}">${im.length>1?`<i class="mb">+${im.length-1}</i>`:""}</span>`:""}${nm}${ctl}</div>`; });
  $("l").innerHTML=h||`<div class="msg">${esc(tx.none)}</div>`;
  let c=0,tot=0;Object.keys(Q).forEach(k=>{c+=Q[k];tot+=Q[k]*D.items[k].p;});
  $("go").disabled=!c; $("tt").textContent=c?(tot>0&&!NOTOT.includes(D.biz)?tx.total+" "+fm(tot):"×"+c):"";
}
function send(){
  const ls=Object.keys(Q).map(k=>{const it=D.items[k];return "• "+Q[k]+" × "+it.n+(it.p>0&&!NOTOT.includes(D.biz)?" ("+fm(Q[k]*it.p)+")":"");});if(!ls.length)return;
  let tot=0;Object.keys(Q).forEach(k=>tot+=Q[k]*D.items[k].p);const nm=$("cn").value.trim(), fe=$("fe"); fe.hidden=true;
  const ex=[]; const dl=$("f_dl");
  for(const f of fields()){ const el=$("f_"+f.k); if(!el) continue; if(f.ifd&&dl&&dl.value!=="1") continue; let v=el.value.trim(); if(!v) continue;
    if(f.t==="sel") v=f.o[+v][lg==="fr"?0:1]; if(f.t==="date") v=new Date(v+"T12:00").toLocaleDateString(lg==="fr"?"fr-FR":"en-GB",{day:"numeric",month:"short",year:"numeric"}); ex.push((lg==="fr"?f.fr:f.en).replace(/\s*\(.*\)$/,"")+": "+v); }
  if(D.biz==="hotel"){ const a=$("f_d1").value, b=$("f_d2").value; if(!a||!b||b<=a){ fe.textContent=tx.e1; fe.hidden=false; $("fm").scrollIntoView({block:"center"}); return; } }
  const bk=BOOK.includes(D.biz);
  const text=tx.hi+" "+D.name+", "+(bk?tx.askB:tx.ask)+"\n"+ls.join("\n")+(tot>0&&!NOTOT.includes(D.biz)?"\n"+tx.total+": "+fm(tot):"")+(ex.length?"\n"+ex.join("\n"):"")+(nm?"\n"+tx.nm+" "+nm:"");
  location.href="https://wa.me/"+String(D.phone||"").replace(/\D/g,"")+"?text="+encodeURIComponent(text);
}
function report(){
  $("rp").innerHTML=`<div class="rs"><b>${esc(tx.why)}</b>${[1,2,3,4].map(n=>`<button data-r="${n}">${esc(tx["r"+n])}</button>`).join("")}</div>`;
  $("rp").onclick=async e=>{const b=e.target.closest("button[data-r]");if(!b)return;const why=tx["r"+b.dataset.r];$("rp").onclick=null;
    try{await fetch(String(ECRICI.url).replace(/\/+$/,"")+"/rest/v1/catalog_reports",{method:"POST",headers:{apikey:ECRICI.key,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({slug:slug,reason:why})});}catch(_){}
    $("rp").innerHTML=esc(tx.thx);};
}
load();
</script>
</body>
</html>
