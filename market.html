function card(r){ const bn=BZ.find(b=>b[0]===r.biz), col=/^#[0-9a-f]{6}$/i.test(r.col||"")?r.col:"#0E1A4F";
  const av=okImg(r.logo)?`<img class="av" alt="" loading="lazy" decoding="async" src="${esc(r.logo)}">`:`<div class="av" style="background:${col}">${esc((r.name||"?").trim().slice(0,2).toUpperCase())}</div>`;
  return `<a class="sc" href="${url(r.slug)}"><div class="cv" style="background:linear-gradient(135deg,${col},#0E1A4F)"></div><div class="r">${av}<div class="t"><b>${esc(r.name)}</b>${r.verified?`<span class="vf" title="${esc(tx().vft)}">✔ ${esc(tx().vf)}</span>`:""}${r.near===0?`<span class="ny">${esc(tx().ny)}</span>`:""}<div class="m">${esc([(TR.find(x=>x[0]===r.tr&&x[0]!=="other")?nm(TR.find(x=>x[0]===r.tr)):(bn?nm(bn):"")),place(r)].filter(Boolean).join(" · "))}</div>${r.tag?`<div class="tg">${esc(r.tag)}</div>`:""}${(r.matches||[]).length?`<div class="mt">${r.matches.map(m=>`<span>${esc(m.n)}${m.f?" · "+esc(m.f):""}</span>`).join("")}</div>`:""}<span class="go">${esc(tx().visit)} →</span></div></div></a>`; }
const rpc=(fn,b)=>fetch(BASE+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:ECRICI.key,"Content-Type":"application/json"},body:JSON.stringify(b)});
const withNear=b=>Object.assign({},b,{p_near_city:cy||null,p_near_country:(co||nco)||null});
async function call(fn,base){ let r=await rpc(fn,withNear(base)); if(!r.ok&&fn==="market_search") r=await rpc(fn,base); return r; }
async function loadProducts(more,my){
  try{ const r=await call("market_products",{p_q:q,p_country:co||null,p_biz:bz||null,p_limit:10,p_offset:poff}); if(!r.ok) throw 0; const j=await r.json(); if(my!==seq) return;
    const ok=j.filter(x=>okImg(x.i)); if(!more){ $("pg").innerHTML=""; $("ps").hidden=!ok.length; }
    $("pg").insertAdjacentHTML("beforeend",ok.map(pcard).join("")); poff+=j.length; $("pm").innerHTML=j.length>=10?`<button class="more" id="pmb" type="button">${esc(tx().more)}</button>`:""; if($("pmb")) $("pmb").onclick=()=>loadProducts(true,seq);
  }catch(e){ if(!more) $("ps").hidden=true; } }
async function load(more){ const my=++seq;
  if(!more){ off=0; poff=0; $("r").innerHTML='<div class="sk s"></div><div class="sk s"></div><div class="sk s"></div>'; $("mr").innerHTML=""; $("pg").innerHTML='<div class="sk p"></div><div class="sk p"></div>'; $("ps").hidden=false; loadProducts(false,my); }
  try{ const r=await call("market_search",{p_q:q,p_country:co||null,p_biz:bz||null,p_limit:24,p_offset:off});
    if(!r.ok) throw 0; const j=await r.json(); if(my!==seq) return;
    if(!more) $("r").innerHTML="";
    if(!j.length&&!more){ $("r").innerHTML=`<div class="msg"><i>🔎</i><b>${esc(tx().none)}</b>${esc(tx().nones)}<br><a class="cta" href="https://ecrici.com/">${esc(tx().cta)}</a></div>`; return; }
    $("r").insertAdjacentHTML("beforeend",j.map(card).join("")); off+=j.length; $("mr").innerHTML=j.length>=24?`<button class="more" id="mb" type="button">${esc(tx().more)}</button>`:""; if($("mb")) $("mb").onclick=()=>load(true);
  }catch(e){ if(my===seq){ $("r").innerHTML=`<div class="msg"><i>📡</i>${esc(tx().err)}</div>`; $("ps").hidden=true; } } }
function sync(){ const p=new URLSearchParams(); if(q)p.set("q",q); if(co)p.set("c",co); if(bz)p.set("b",bz); if(lg==="fr")p.set("l","fr"); history.replaceState(null,"",location.pathname+(p.toString()?"?"+p:"")); try{ localStorage.setItem("ecrici-market-co",co); }catch(e){} }
$("q").addEventListener("input",e=>{ q=e.target.value.trim(); clearTimeout(tm); tm=setTimeout(()=>{ sync(); load(); },350); });
$("co").addEventListener("change",e=>{ co=e.target.value; sync(); near(); load(); });
$("ch").addEventListener("click",e=>{ const b=e.target.closest("button[data-b]"); if(!b) return; bz=b.dataset.b; [...$("ch").children].forEach(x=>x.setAttribute("aria-pressed",x===b)); trades(); sync(); load(); });
$("trs").addEventListener("click",e=>{ const b=e.target.closest("button[data-q]"); if(!b) return; q=(q.toLowerCase()===b.dataset.q.toLowerCase())?"":b.dataset.q; $("q").value=q; trades(); sync(); load(); });
$("lg").onclick=()=>{ lg=lg==="fr"?"en":"fr"; try{ localStorage.setItem("ecrici-lang",lg); }catch(e){} chrome(); near(); sync(); load(); };
if(!co&&!sp.has("c")){ try{ co=localStorage.getItem("ecrici-market-co")||""; }catch(e){} }
chrome(); near(); load();
</script>
</body>
