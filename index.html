<noscript><main style="max-width:640px;margin:0 auto;padding:24px;font-family:sans-serif"><h1>Ecrici</h1><p>Ecrici is a simple shop ledger app: sales, customer credit, stock and PDF receipts on WhatsApp. Works without internet. Please turn on JavaScript to use it.</p><p lang="fr">Ecrici est le cahier de votre boutique sur téléphone : ventes, crédits clients, stock et reçus PDF sur WhatsApp. Fonctionne sans internet. Activez JavaScript pour l'utiliser.</p><h2>What is Ecrici?</h2><p>Ecrici is a simple shop ledger app. You record sales, customer credit, stock and expenses on your phone and see your profit in a daily or monthly report.</p><h2>Does Ecrici work without internet?</h2><p>Yes. You can keep selling when the network is down. Your records save on the phone and sync to your account when you are back online.</p><h2>Can I send receipts on WhatsApp?</h2><p>Yes. Every sale makes a PDF receipt or invoice named after the customer. Send it on WhatsApp in one tap.</p><h2>How much does Ecrici cost?</h2><p>From 1,000 FCFA per month in French-speaking Africa, N2,500 in Nigeria and GH₵20 in Ghana, with a 7-day free trial. Extra shops cost a little more.</p><h2>Can I manage several shops and employees?</h2><p>Yes. Add extra shops with separate books and give each employee their own login, tied to one shop.</p></main></noscript>

<style>
/* Layout: a notebook-style ledger. Header with shop name, one scrolling column, fixed tab bar at the bottom. */
:root{
  --paper:#f3f5fa;
  --card:#ffffff;
  --ink:#16203f;
  --muted:#5d6784;
  --line:#dde2ee;
  --accent:#2447d6;
  --accent-ink:#ffffff;
  --owed:#b4321f;
  --owed-bg:#fbe9e5;
  --paid:#17714a;
  --paid-bg:#e2f4ea;
  --warn-bg:#fff3d1;
  --warn-ink:#6b4b00;
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f1527;--card:#171f38;--ink:#e8ecf8;--muted:#9aa5c6;--line:#2a3558;
    --accent:#7d97ff;--accent-ink:#0c1230;--owed:#ff9a88;--owed-bg:#3a1c1a;--paid:#6fd9a2;--paid-bg:#14301f;
    --warn-bg:#3b2f0d;--warn-ink:#f3d78a;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f1527;--card:#171f38;--ink:#e8ecf8;--muted:#9aa5c6;--line:#2a3558;
  --accent:#7d97ff;--accent-ink:#0c1230;--owed:#ff9a88;--owed-bg:#3a1c1a;--paid:#6fd9a2;--paid-bg:#14301f;
  --warn-bg:#3b2f0d;--warn-ink:#f3d78a;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 96px;
}
.wrap{max-width:720px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono,.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.num{font-weight:500}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px;flex-wrap:wrap}
.brand{min-width:0}
.brand h1{font-size:1.5rem;line-height:1.1;overflow-wrap:anywhere}
.brand small{color:var(--muted);font-size:.8rem}
.chips{display:flex;gap:8px;align-items:center}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.82rem;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.status{font-size:.75rem;color:var(--muted)}

/* banner */
.banner{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:6px 0 14px;font-size:.9rem}

/* sections */
.sec{margin-top:22px;display:grid;gap:10px}
.sec>h2{font-size:1.05rem;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec>h2 span{font-family:var(--font-body);font-weight:500;font-size:.8rem;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.card.flush{padding:0;overflow:hidden}

/* summary */
.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sum .card{min-width:0}
.sum .lbl{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sum .val{font-size:1.15rem;margin-top:4px;overflow-wrap:anywhere}
.sum .owed .val{color:var(--owed)}
.sum .got .val{color:var(--paid)}

/* rows */
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-width:0;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .name{font-weight:600;overflow-wrap:anywhere}
.row .sub{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.row .amt{text-align:right;white-space:nowrap}
#pk-inl{max-height:150px;overflow:auto}#pk-inl[hidden],.pk-hint[hidden]{display:none}
.row.pk1{padding:0 14px;min-height:46px;gap:10px;font-size:.95rem}
.row.pk1:first-child{border-top:0}
#tour{position:fixed;inset:0;z-index:9000;background:rgba(10,14,30,.6);display:flex;align-items:flex-end;justify-content:center;animation:tfade .2s ease}
.tour-card{width:100%;max-width:460px;background:var(--card);border-radius:28px 28px 0 0;overflow:hidden;box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:tup .28s cubic-bezier(.2,.8,.2,1);padding-bottom:max(18px,env(safe-area-inset-bottom))}
.tour-art{position:relative;height:190px;background:linear-gradient(145deg,var(--tc),color-mix(in srgb,var(--tc) 70%,#000));display:grid;place-items:center;overflow:hidden;transition:background .25s}
.tour-art i{position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
.tour-art .tc1{width:220px;height:220px;left:-70px;top:-90px}.tour-art .tc2{width:150px;height:150px;right:-40px;bottom:-60px}
.tour-ic{position:relative;width:96px;height:96px;border-radius:30px;background:rgba(255,255,255,.2);backdrop-filter:blur(2px);display:grid;place-items:center;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.tour-skip{position:absolute;top:14px;right:14px;border:0;background:rgba(255,255,255,.22);color:#fff;font:inherit;font-size:.85rem;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer}
.tour-body{padding:22px 24px 6px;min-height:150px;animation:tstep .22s ease}
.tour-body h2{margin:0 0 8px;font-size:1.35rem;line-height:1.2;color:var(--ink)}
.tour-body p{margin:0;font-size:1rem;line-height:1.55;color:var(--muted)}
.tour-dots{display:flex;justify-content:center;gap:6px;padding:12px 0 6px}
.tour-dots span{width:7px;height:7px;border-radius:99px;background:var(--line);transition:all .2s}
.tour-dots span.on{width:22px;background:#2447d6}
.tour-btns{display:flex;gap:10px;padding:8px 20px 0}
.tour-btns .btn{flex:1;min-height:50px}
.tour-btns .btn[hidden]{display:block;visibility:hidden}
@keyframes tfade{from{opacity:0}to{opacity:1}}@keyframes tup{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}@keyframes tstep{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@media(min-width:600px){#tour{align-items:center}.tour-card{border-radius:28px;padding-bottom:20px}}
@media(prefers-reduced-motion:reduce){#tour,.tour-card,.tour-body{animation:none}}
.pk-tg{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;padding:4px 0;margin:0 0 6px;font:inherit;font-size:.85rem;font-weight:700;letter-spacing:.02em;color:var(--muted);cursor:pointer;text-align:left}
.pk-tg .pk-ar{width:9px;height:9px;margin:0 8px 3px 0;border-right:2.5px solid #1b2150;border-bottom:2.5px solid #1b2150;transform:rotate(45deg);transition:transform .15s}
.pk-tg[aria-expanded=false] .pk-ar{transform:rotate(-45deg);margin:0 10px 0 0}
.pk-tg[aria-expanded=false]{margin-bottom:0}
.pk1 .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk1 .meta{font-size:.8rem;color:var(--muted);white-space:nowrap}
.pk1 .qn{color:var(--accent,#2347d6)}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.74rem;font-weight:600}
.badge.owed{background:var(--owed-bg);color:var(--owed)}
.badge.paid{background:var(--paid-bg);color:var(--paid)}
.badge.late{background:var(--warn-bg);color:var(--warn-ink)}
.empty{padding:22px 14px;color:var(--muted);text-align:center}

/* forms */
.form{display:grid;gap:14px}
.field{display:grid;gap:6px;min-width:0}
.field>label,.lab{font-size:.8rem;color:var(--muted);font-weight:600;letter-spacing:.03em}
input,select,textarea{width:100%;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
input[type=number]{font-family:var(--font-mono)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lines{display:grid;gap:10px}
.line{display:grid;grid-template-columns:76px minmax(0,1fr) 40px;gap:8px;align-items:center}
.line>input:first-child{grid-column:1/-1}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--owed);border-color:var(--owed)}
.btn.small{padding:6px 10px;min-height:34px;font-size:.85rem}
.btn.ghost{background:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.x{border:0;background:none;color:var(--muted);font-size:1.3rem;cursor:pointer;min-height:36px}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-top:6px;border-top:2px solid var(--ink)}
.total .num{font-size:1.4rem}
.err{color:var(--owed);font-size:.88rem;min-height:1.2em}
.note{color:var(--muted);font-size:.85rem}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
.tabs button{background:none;border:0;padding:8px 2px;border-radius:10px;cursor:pointer;color:var(--muted);font-size:.7rem;font-weight:600;min-width:0}
.tabs button[aria-current="page"]{color:var(--accent);background:var(--paper)}
.tabs svg{display:block;margin:0 auto 3px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* modal + receipt */
.veil{position:fixed;inset:0;background:rgba(10,14,30,.55);z-index:20;overflow-y:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{max-width:440px;margin:0 auto;display:grid;gap:12px}
.dlg{background:var(--card);border-radius:14px;padding:16px;display:grid;gap:12px}
.ticket{background:var(--card);border-radius:14px;padding:22px 20px;font-family:var(--font-body);font-size:.95rem;line-height:1.5}
.ticket{--acc:#2447d6}
.ticket .hd{text-align:center;margin:-22px -20px 0;padding:20px 16px 16px;border-radius:14px 14px 0 0;background:var(--acc);color:#fff}
.ticket .hd .sub{color:rgba(255,255,255,.88)}
.ticket .mono{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-family:var(--font-display);font-weight:700;font-size:1.1rem;letter-spacing:.04em}
.dtg{display:flex;gap:6px;flex-wrap:wrap}.dtg button{border:1px solid var(--line,#ccc);background:transparent;color:inherit;border-radius:99px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer}.dtg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.phg{display:flex;gap:8px;flex-wrap:wrap}.pht{position:relative;width:72px;height:72px;border-radius:12px;overflow:hidden;background:var(--line,#ddd);flex:none}.pht img{width:100%;height:100%;object-fit:cover;display:block}.pht.add{display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px dashed var(--line,#bbb);background:transparent;cursor:pointer;color:inherit}.pht.add span{font-size:24px;line-height:1}.pht.add small{font-size:11px}.phx{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:1;padding:0;cursor:pointer}.phm{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:10px;text-align:center;padding:1px 0}
.sw{display:flex;gap:7px;flex-wrap:wrap}.sw button{width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}.sw button[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 2px var(--card) inset}
.ticket h3{font-family:var(--font-display);font-size:1.4rem;letter-spacing:.02em;text-transform:uppercase;overflow-wrap:anywhere}
.ticket .sub{color:var(--muted);font-size:.88rem}
.ticket .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:12px 0;border-bottom:1px dashed var(--line);font-size:.88rem;color:var(--muted)}
.ticket .meta b{color:var(--ink);font-weight:600}
.ticket .who{padding:12px 0 4px;font-size:.95rem}
.ticket .who span{color:var(--muted)}
.ticket table{width:100%;border-collapse:collapse;margin:6px 0}
.ticket th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;text-align:left;padding:6px 0;border-bottom:1px solid var(--line)}
.ticket td{padding:7px 0;vertical-align:top;text-align:left;border-bottom:1px solid var(--line)}
.ticket td.r,.ticket th.r{text-align:right;white-space:nowrap;padding-left:10px;font-variant-numeric:tabular-nums}
.ticket .tot{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
.ticket .tot.grand{font-size:1.15rem;font-weight:700;border-top:2px solid var(--acc);margin-top:6px;padding-top:10px}
.ticket .owe{display:flex;justify-content:space-between;gap:10px;margin-top:10px;padding:10px 12px;border:1px solid var(--owed);border-radius:10px;color:var(--owed);font-weight:600}
.ticket .note2{margin-top:8px;font-size:.88rem;color:var(--muted)}
.ticket .bal{margin-top:10px;font-size:.88rem;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.ticket .bal b{color:var(--ink)}
.ticket .thanks{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line);text-align:center;color:var(--muted);font-size:.9rem}
.chk{display:flex;gap:10px;align-items:center;font-size:.95rem}.chk input{width:20px;height:20px}
.msg{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.92rem}
a.btn{text-decoration:none;display:inline-flex;align-items:center;color:inherit}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:14px;font-size:.88rem;line-height:1.35;text-align:center;z-index:30;width:max-content;max-width:min(92vw,360px)}
.hint{grid-column:1/-1;font-size:.78rem;color:var(--muted);margin-top:-4px}.hint:empty{display:none}
.lock{max-width:380px;margin:12vh auto 0}
.pin{letter-spacing:.5em;font-family:var(--font-mono);text-align:center}
.code{font-family:var(--font-mono);font-size:1.1rem;letter-spacing:.15em}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:6px}
.bars .b{flex:1;min-width:0;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.bars .b.zero{background:var(--line)}
.blabels{display:flex;gap:3px;margin-top:4px}
.blabels span{flex:1;min-width:0;font-size:.62rem;color:var(--muted);display:flex;justify-content:center;overflow:visible;white-space:nowrap}
.row.voided .name,.row.voided .amt .num{text-decoration:line-through;opacity:.6}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.stat:first-child{border-top:0}.stat>span:first-child{min-width:0;overflow-wrap:anywhere}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav .lbl2{flex:1;text-align:center;font-weight:600;text-transform:capitalize;min-width:0;overflow-wrap:anywhere}
.up{color:var(--paid)}.down{color:var(--owed)}

/* bigger screens: tablets and computers */
@media (min-width:600px){
  .wrap{max-width:820px}
  .sum{grid-template-columns:repeat(4,minmax(0,1fr))}
  .sheet{max-width:520px}
  .veil{padding-top:max(5vh,16px)}
}
@media (min-width:600px) and (max-width:899px){
  .line{grid-template-columns:minmax(0,1fr) 90px 140px 40px}
  .line>input:first-child{grid-column:auto}
}
@media (min-width:900px){
  body{padding-left:calc(232px + 24px);padding-right:24px;padding-bottom:48px}
  body:has(.tabs:empty){padding-left:24px}
  .wrap{max-width:900px}
  .tabs{left:0;right:auto;top:0;bottom:0;width:216px;display:flex;flex-direction:column;gap:4px;padding:20px 12px;border-top:0;border-right:1px solid var(--line)}
  .tabs:empty{display:none}
  .tabs::before{content:"Ecrici";font-family:var(--font-display);font-weight:700;font-size:1.5rem;padding:4px 14px 18px;color:var(--ink)}
  .tabs button{display:flex;align-items:center;gap:12px;text-align:left;font-size:.95rem;padding:12px 14px;white-space:nowrap}
  .tabs svg{margin:0}
  .toast{bottom:28px;left:calc(50% + 116px)}
  .items{grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:16px;align-items:start}
  .items>.lab,.items>.pk-tg{grid-column:1/-1}
  .items>#pk-inline,.items>#pk-inl,.items>.pk-hint{grid-column:1}
  .items>#lines{grid-column:2;grid-row:2 / span 3}
  .items>[data-act=add-line]{grid-column:2}
  #pk-inl{max-height:380px!important}
  .sheet{max-width:560px}
}
@media (hover:hover){ .row:hover{background:var(--paper)} .btn:hover,.pill:hover{filter:brightness(.96)} .tabs button:hover{background:var(--paper)} }

@media (prefers-reduced-motion:no-preference){.veil{animation:fade .12s ease-out}@keyframes fade{from{opacity:0}to{opacity:1}}}

function balanceOf(custId, uptoNo){

  for(const x of S.txs){ if(x.cust!==custId||x.void) continue; if(uptoNo&&x.no>uptoNo) continue;

/* unpaid sales, payments applied oldest first */
function unpaidSales(custId){
  const mine=S.txs.filter(x=>x.cust===custId&&!x.void).sort((a,b)=>a.no-b.no);
  let pool=mine.filter(x=>x.type==="payment").reduce((s,x)=>s+x.amount,0); const out=[];
  for(const x of mine){ if(x.type!=="sale") continue; let owe=x.total-x.paid;
    if(owe<=0) continue; const use=Math.min(pool,owe); pool-=use; owe-=use; if(owe>0.001) out.push({x,owe}); }
  return out;
}

function intlPhone(raw){
  const plus=/^\s*(\+|00)/.test(String(raw||""));
  let d=String(raw||"").replace(/\D/g,""); if(!d) return "";
  const cc=C().cc;
  if(d.startsWith("00")) d=d.slice(2);
  if(plus&&!d.startsWith(cc)) return d;
  if(S.shop.country==="BJ"&&d.startsWith(cc)&&d.length===cc.length+8) return cc+"01"+d.slice(cc.length);
  if(d.startsWith(cc)&&d.length>=cc.length+8) return d;
  if(S.shop.country==="BJ"){ if(d.length===8) d="01"+d; return cc+d; }
  return cc+(C().keep0?d:d.replace(/^0+/,""));
}

async function pushCloud(){

  if(cloudBusy){ cloudDirty=true; return; }
  cloudBusy=true;
  try{
    const json=JSON.stringify(S);
    if(json.length>230000) throw new Error("too large");
    await cloud.set({json,updated:S.updated});
    storeMode="account";
  }catch(e){ storeMode="device"; }

}
async function initCloud(){
  try{
    if(!window.claude||!claude.use) return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    const ref=db.doc("data/users/"+id+"/ledger");
    const snap=await ref.get();
    cloud=ref;
    if(snap.exists){
      const d=snap.data();
      if(d&&d.json&&d.updated>(S.updated||0)){
        try{ const parsed=JSON.parse(d.json); if(parsed&&parsed.shop){ S=migrate(parsed); try{localStorage.setItem(LS_KEY,d.json);}catch(e){} render(); } }catch(e){}
      }else{ pushCloud(); }
    }else{ pushCloud(); }
    storeMode="account"; updateStatus();
  }catch(e){ cloud=null; storeMode="device"; updateStatus(); }
}

  if(p.shop.staffOn&&!p.staff.length) p.shop.staffOn=false;

/* --- reports --- */
function startOf(period,off){
  const n=new Date(); n.setHours(0,0,0,0); let a,b;
  if(period==="day"){ a=new Date(n); a.setDate(a.getDate()+off); b=new Date(a); b.setDate(b.getDate()+1); }
  else if(period==="week"){ a=new Date(n); const wd=(a.getDay()+6)%7; a.setDate(a.getDate()-wd+off*7); b=new Date(a); b.setDate(b.getDate()+7); }
  else if(period==="month"){ a=new Date(n.getFullYear(),n.getMonth()+off,1); b=new Date(a.getFullYear(),a.getMonth()+1,1); }
  else { a=new Date(n.getFullYear()+off,0,1); b=new Date(a.getFullYear()+1,0,1); }
  return [a,b];
}
function rangeLabel(period,a,b){
  const loc=L()==="fr"?"fr-FR":"en-GB";
  if(period==="day") return a.toLocaleDateString(loc,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  if(period==="week"){ const e=new Date(b); e.setDate(e.getDate()-1); return a.toLocaleDateString(loc,{day:"numeric",month:"short"})+" – "+e.toLocaleDateString(loc,{day:"numeric",month:"short",year:"numeric"}); }
  if(period==="month") return a.toLocaleDateString(loc,{month:"long",year:"numeric"});
  return String(a.getFullYear());
}
function stats(a,b){
  const r={sales:0,collected:0,credit:0,debtPaid:0,count:0,profit:0,profitBase:0,expenses:0,expList:[],prod:{},cust:{}};
  for(const x of S.txs){ if(x.void) continue; const d=new Date(x.date); if(d<a||d>=b) continue;
    if(x.type==="sale"){
      r.sales+=x.total; r.collected+=x.paid; r.credit+=x.total-x.paid; r.count++;
      const ck=x.cust||"_walk"; r.cust[ck]=(r.cust[ck]||0)+x.total;
      x.lines.forEach(l=>{ const rev=l.q*l.p; const key=l.pid||("n:"+(l.d||"").toLowerCase());
        const e=r.prod[key]||(r.prod[key]={name:l.d||t("goods"),q:0,rev:0}); e.q+=l.q; e.rev+=rev;
        if(l.c>0){ r.profit+=(l.p-l.c)*l.q; r.profitBase+=rev; } });
    }else{ r.collected+=x.amount; r.debtPaid+=x.amount; } }
  for(const e of (S.expenses||[])){ const d=new Date(e.date); if(d<a||d>=b) continue; r.expenses+=e.amount; r.expList.push(e); }
  r.expList.sort((x,y)=>new Date(y.date)-new Date(x.date));
  return r;
}
function buckets(period,a){
  const loc=L()==="fr"?"fr-FR":"en-GB", out=[];
  if(period==="week"){ for(let i=0;i<7;i++){ const s=new Date(a); s.setDate(s.getDate()+i); const e=new Date(s); e.setDate(e.getDate()+1); out.push({s,e,label:s.toLocaleDateString(loc,{weekday:"narrow"}),full:s.toLocaleDateString(loc,{weekday:"long",day:"numeric",month:"short"})}); } }
  else if(period==="month"){ const days=new Date(a.getFullYear(),a.getMonth()+1,0).getDate(); for(let i=1;i<=days;i++){ const s=new Date(a.getFullYear(),a.getMonth(),i); const e=new Date(a.getFullYear(),a.getMonth(),i+1); out.push({s,e,label:(i===1||i%5===0)?String(i):"",full:s.toLocaleDateString(loc,{day:"numeric",month:"long"})}); } }
  else if(period==="year"){ for(let m=0;m<12;m++){ const s=new Date(a.getFullYear(),m,1); const e=new Date(a.getFullYear(),m+1,1); out.push({s,e,label:s.toLocaleDateString(loc,{month:"narrow"}),full:s.toLocaleDateString(loc,{month:"long",year:"numeric"})}); } }
  return out;
}
function salesBetween(a,b){ let n=0; for(const x of S.txs){ if(x.void||x.type!=="sale") continue; const d=new Date(x.date); if(d>=a&&d<b) n+=x.total; } return n; }
function viewReports(){
  const per=ui.repPeriod, off=ui.repOff, [a,b]=startOf(per,off), st=stats(a,b);
  const [pa,pb]=startOf(per,off-1); const prev=stats(pa,pb).sales;
  const delta=prev>0?Math.round((st.sales-prev)/prev*100):null;
  const periods=[["day","p_day"],["week","p_week"],["month","p_month"],["year","p_year"]];
  let h=`<section class="sec"><h2>${t("reports")}</h2>
    <div class="seg">${periods.map(([k,l])=>`<button class="pill" data-act="rep-period" data-p="${k}" aria-pressed="${per===k}">${t(l)}</button>`).join("")}</div>
    <div class="nav"><button class="btn small" data-act="rep-prev" aria-label="←">←</button><div class="lbl2">${esc(rangeLabel(per,a,b))}</div>
      <button class="btn small" data-act="rep-next" aria-label="→" ${off>=0?"disabled":""}>→</button></div>`;
  h+=`<div class="sum">
    <div class="card"><div style="font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">${t("rep_sales")}</div><div class="val num" style="font-size:1.15rem;margin-top:4px;overflow-wrap:anywhere">${money(st.sales)}</div>
      ${delta!==null&&off<0?`<div class="note ${delta>=0?"up":"down"}">${delta>=0?"+":""}${delta}% ${t("rep_vs")}</div>`:""}</div>
    ${nostock()?"":`<div class="card"><div style="font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">${t("rep_profit")}</div>
      <div class="val num" style="font-size:1.15rem;margin-top:4px;overflow-wrap:anywhere;color:${st.profitBase>0?(st.profit>=0?"var(--paid)":"var(--owed)"):"var(--muted)"}">${st.profitBase>0?money(st.profit):"—"}</div>
      <div class="note">${st.profitBase>0?t("rep_profit_note",Math.round(st.profitBase/Math.max(1,st.sales)*100)):t("rep_no_profit")}</div></div>`}</div>`;
  const bk=buckets(per,a);
  if(bk.length){
    const vals=bk.map(x=>salesBetween(x.s,x.e)), mx=Math.max(...vals,0);
    h+=`<div class="card"><div class="note" style="margin-bottom:4px">${t("rep_sales")}${mx>0?` · max ${money(mx)}`:""}</div>
      <div class="bars" role="img" aria-label="${t("rep_sales")}">${vals.map((v,i)=>`<div class="b${v>0?"":" zero"}" style="height:${mx>0?Math.max(2,Math.round(v/mx*100)):2}%" title="${esc(bk[i].full)}: ${esc(money(v))}"></div>`).join("")}</div>
      <div class="blabels">${bk.map(x=>`<span>${esc(x.label)}</span>`).join("")}</div></div>`;
  }
  h+=`<div class="card flush">
    <div class="stat"><span>${t("rep_collected")}</span><span class="num" style="color:var(--paid)">${money(st.collected)}</span></div>
    <div class="stat"><span>${t("rep_credit")}</span><span class="num" style="color:var(--owed)">${money(st.credit)}</span></div>
    <div class="stat"><span>${t("rep_debtpaid")}</span><span class="num">${money(st.debtPaid)}</span></div>
    <div class="stat"><span>${t("rep_count")}</span><span class="num">${st.count}</span></div></div>`;
  h+=`<h2>${t("exp_title")}<button class="btn small primary" data-act="add-expense">${t("exp_add")}</button></h2><div class="card flush">
    <div class="stat"><span>${t("exp_total")}</span><span class="num" style="color:var(--owed)">${money(st.expenses)}</span></div>
    <div class="stat"><span>${t("exp_cash")}</span><span class="num" style="color:${st.collected+st.debtPaid-st.expenses>=0?"var(--paid)":"var(--owed)"}">${money(st.collected+st.debtPaid-st.expenses)}</span></div>
    ${st.profitBase>0?`<div class="stat"><span>${t("exp_net")}</span><span class="num" style="color:${st.profit-st.expenses>=0?"var(--paid)":"var(--owed)"}">${money(st.profit-st.expenses)}</span></div>`:""}
    ${st.expList.length?st.expList.map(e=>`<div class="stat"><span>${esc(e.label)} <span class="note">· ${esc(new Date(e.date).toLocaleDateString(L()==="fr"?"fr-FR":"en-GB",{day:"2-digit",month:"short"}))}</span></span><span class="num">${money(e.amount)} <button class="x" data-act="del-expense" data-id="${e.id}" aria-label="×">×</button></span></div>`).join(""):`<div class="empty">${t("exp_none")}</div>`}</div>
    <p class="note" style="margin:0">${t("exp_cash_note")}${st.profitBase>0?" "+t("exp_net_note"):""}</p>`;
  if((S.expRules||[]).length) h+=`<h2>${t("exp_rules")}</h2><div class="card flush">${S.expRules.map(r=>`<div class="stat"><span>${esc(r.label)} <span class="note">· ${money(r.amount)} ${t(r.freq==="week"?"exp_w":r.freq==="month"?"exp_m":"exp_y")}</span></span><span class="num"><button class="x" data-act="stop-rule" data-id="${r.id}" aria-label="×">×</button></span></div>`).join("")}</div>`;

    h+=`<h2>${t("rep_top_products")}</h2><div class="card flush">${tp.map(e=>`<div class="stat"><span>${esc(e.name)} <span class="note">· ${e.q} ${t("sold_units")}</span></span><span class="num">${money(e.rev)}</span></div>`).join("")}</div>
      <h2>${t("rep_top_customers")}</h2><div class="card flush">${tc.map(([k,v])=>`<div class="stat"><span>${esc(k==="_walk"?t("walk"):custName(k))}</span><span class="num">${money(v)}</span></div>`).join("")}</div>`;
  }
  return h+`</section>`;
}

    return `<button class="row" data-act="open-product" data-id="${p.id}"><div class="main"><div class="name">${esc(p.name)}</div><div class="sub">${money(p.price)}${(()=>{ const B=pbs(p).filter(b=>b.q>0), f=B.filter(b=>b.e).map(b=>b.e).sort()[0]; return f?" · "+lx("Exp. ","Exp. ")+fmtExp(f)+(B.length>1?" · "+B.length+" "+lx("lots","batches"):""):""; })()}</div></div><div class="amt"><div class="num">${p.qty}</div>${(()=>{ const e=expState(p); return e&&e.s==="expired"?`<span class="badge owed">${lx("Périmé","Expired")}</span>`:e&&e.s==="soon"?`<span class="badge late">${lx("Expire bientôt","Expiring")}</span>`:st; })()}</div></button>`; }).join("");

function saveBulk(){
  const er=$("#bulk-err"), raw=($("#bulk-txt").value||"");
  const lines=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  if(!lines.length){ er.textContent=t("bulk_empty"); return; }
  const names=new Set(S.products.map(p=>p.name.toLowerCase())); let added=0, dup=0; const bad=[];
  for(const ln of lines){
    const parts=ln.split(/[,;\t]/).map(x=>x.trim());
    const name=parts[0], price=parseAmt(parts[1]);
    if(!name||!(price>0)){ bad.push(ln); continue; }
    if(names.has(name.toLowerCase())){ dup++; continue; }
    const q=(parts[2]||"").toLowerCase(), svc=nostock()||/^(service|svc|s)$/.test(q);
    if(biz()==="hotel"){ const rooms=Math.max(1,Math.round(parseAmt(parts[2]))||1); S.products.push({id:uid(),name,price,qty:0,low:0,cost:0,svc:true,rooms}); names.add(name.toLowerCase()); added++; continue; }
    if(biz()==="pharmacy"&&!svc){ const qty=Math.max(0,parseAmt(parts[2])), ex=(parts[3]||"").trim(), e=ex?parseExp(ex):"";
      if(e===null||(e&&bState({e}).s==="expired")){ bad.push(ln); continue; }
      const bt=(parts[4]||"").trim(), pr={id:uid(),name,price,qty,low:5,cost:0,svc:false}; if(qty>0&&(e||bt)) pr.bs=[{n:bt,e:e||"",q:qty}];

async function saveCat(){

/* ---------- receipts & messages ---------- */
const pad4=n=>String(n).padStart(4,"0");
const docTitle=(x,kind)=>`${kind==="invoice"?t("invoice"):t("receipt")} ${t("receipt_no")} ${pad4(x.no)}`;
function receiptLines(x,kind){
  kind=kind||"receipt"; const sh=S.shop; const out=[];
  out.push(sh.name.toUpperCase()); if(sh.phone) out.push(fmtPhone(sh.phone)); if(sh.address) out.push(sh.address); if(sh.taxId) out.push(sh.taxId);
  out.push(docTitle(x,kind),fmtDate(x.date)); if(x.void) out.push("*** "+t("cancelled").toUpperCase()+" ***"); out.push("");
  if(kind==="invoice"&&x.type==="sale"){ out.push(`[${t(invStatus(x)[0])}]`,`${t("bill_to")}: ${custName(x.cust)}${custPhone(x.cust)?" · "+custPhone(x.cust):""}`); }
  else out.push(`${t("customer")}: ${custName(x.cust)}`);
  if(x.by) out.push(`${t("served_by")}: ${x.by}`);
  out.push("");
  if(x.type==="sale"){
    x.lines.forEach(l=>{ out.push(kind==="invoice"&&Number(l.q)!==1?`${qLab(l)} × ${l.d||t("goods")} @ ${money(l.p)}  ${money(l.q*l.p)}`:`${qLab(l)} × ${l.d||t("goods")}  ${money(l.q*l.p)}`); if(lnEx(l)) out.push("   "+lnEx(l)); });
    const ow=kind==="invoice"?oweNow(x):x.total-x.paid;
    out.push("-----",`${t("total")}: ${money(x.total)}`,`${t("paid")}: ${money(x.total-ow)}`);
    if(x.method&&x.paid>0) out.push(`${lx("Payé par","Paid by")}: ${t(x.method)}`);
    if(ow>0.001) out.push(`${kind==="invoice"?t("due"):t("balance_left")}: ${money(ow)}`);
    if(ow>0.001&&(x.due||kind==="invoice")) out.push(`${t("due_on")}: ${x.due?fmtDay(x.due):t("due_rcpt")}`);
    if(kind==="invoice"&&payLines().length) out.push("",t("pay_t")+":",...payLines());
  }else{
    out.push(`${t("payment")} (${t(x.method||"cash")}): ${money(x.amount)}`);
  }
  if(x.note) out.push("",x.note);
  if(x.cust) out.push("-----",`${kind==="invoice"?t("balance_now"):t("balance_after")}: ${money(Math.max(0,balanceOf(x.cust,x.no)))}`);
  out.push("",kind==="invoice"?t("invoice_note"):(sh.footer||t("default_footer")));
  return out;
}
const receiptText=(x,kind)=>receiptLines(x,kind).join("\n");

function browserDownload(filename,blob){

}
/* ---- tiny PDF writer (no library, works offline) ---- */
function pdfBlob(lines,acc,hdrN){
  const CP={"—":0x97,"–":0x96,"’":0x92,"‘":0x91,"“":0x93,"”":0x94,"€":0x80,"…":0x85,"œ":0x9C,"Œ":0x8C};
  const enc=str=>{ str=String(str).replace(/₦/g,"NGN ").replace(/GH₵/g,"GHS ").replace(/₵/g,"GHS ").replace(/[  ]/g," ");
    let o=""; for(const ch of str){ const c=ch.codePointAt(0); o+= CP[ch]?String.fromCharCode(CP[ch]) : (c<256?ch:"?"); } return o.replace(/[\\()]/g,m=>"\\"+m); };
  const W=300, M=24, LH=15, MAXC=44, out=[];
  lines.forEach((ln,i)=>{ ln=String(ln);
    if(!ln){ out.push({t:"",b:false}); return; }
    if(/^-{3,}$/.test(ln)){ out.push({t:"",b:false,rule:true}); return; }
    const words=ln.split(" "); let cur="";
    for(const w of words){ if((cur+" "+w).trim().length>MAXC&&cur){ out.push({t:cur,b:i===0,h:i<(hdrN||1)}); cur=w; } else cur=(cur?cur+" ":"")+w; }
    out.push({t:cur,b:i===0,h:i<(hdrN||1)});
  });
  const H=Math.max(260,M*2+out.length*LH+24);
  let cs="", rs="", y=H-M-10;
  const hex=(acc||"#2447d6").replace("#",""), rgb=[0,2,4].map(k=>(parseInt(hex.substr(k,2),16)/255).toFixed(3)).join(" ");
  const nH=out.filter(o=>o.h).length; let hw=0, bk=0, bandH=M+10+nH*LH+12; y=H-M-10-4;
  out.forEach((o,i)=>{ if(o.h&&!hw){ cs+="1 1 1 rg\n"; hw=1; } if(!o.h&&!bk){ cs+="0 0 0 rg\n"; bk=1; y-=10; bandH=H-(y+LH-1); } if(o.rule){ rs+="0.6 w "+M+" "+(y+LH/2-2)+" m "+(W-M)+" "+(y+LH/2-2)+" l S\n"; } if(o.t){ cs+=(o.b?"/F2 15 Tf":"/F1 10.5 Tf")+" 1 0 0 1 "+M+" "+y+" Tm ("+enc(o.t)+") Tj\n"; } y-=(o.b?LH+4:LH); });
  rs=rgb+" rg 0 "+(H-bandH)+" "+W+" "+bandH+" re f\n"+rs; cs=rs+"BT\n"+cs+"ET";
  const objs=[ "<< /Type /Catalog /Pages 2 0 R >>", "<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
    "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+W+" "+H+"] /Contents 4 0 R /Resources << /Font << /F1 5 0 R /F2 6 0 R >> >> >>",
    "<< /Length "+cs.length+" >>\nstream\n"+cs+"\nendstream",
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>",
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>" ];
  let pdf="%PDF-1.4\n", offs=[];
  objs.forEach((o,i)=>{ offs.push(pdf.length); pdf+=(i+1)+" 0 obj\n"+o+"\nendobj\n"; });
  const xr=pdf.length; pdf+="xref\n0 "+(objs.length+1)+"\n0000000000 65535 f \n"+offs.map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("")+"trailer\n<< /Size "+(objs.length+1)+" /Root 1 0 R >>\nstartxref\n"+xr+"\n%%EOF";
  const u=new Uint8Array(pdf.length); for(let i=0;i<pdf.length;i++) u[i]=pdf.charCodeAt(i)&255;
  return new Blob([u],{type:"application/pdf"});
}

/* ---------- actions ---------- */
function setBind(path,val){
  const d=ui.draft;
  if(path==="search"){ ui.search=val; return "search"; }
  if(path==="hsearch"){ ui.histSearch=val; return "hsearch"; }
  if(path==="bc.text"){ bcState().text=val; updateBc(); return; }
  if(!d) return;
  if(path==="cust") d.cust=val;
  else if(path==="part") d.part=val;
  else if(path==="note") d.note=val;
  else if(path==="due") d.due=val;
  else if(path==="nc.name") d.nc.name=val;
  else if(path==="nc.phone") d.nc.phone=val;
  else if(path.startsWith("line.")){
    const [,i,k]=path.split("."); const l=d.lines[+i]; l[k]=val;
    if(k==="p") l.auto=false;

function saveSale(kind){
  const d=ui.draft; d.err="";
  const lines=d.lines.map(l=>({...((l.sn||"").trim()?{sn:l.sn.trim()}:{}),...(l.ci?{ci:l.ci}:{}),...(l.co?{co:l.co}:{}),...((l.w||"").trim()?{w:l.w.trim()}:{}),d:l.d.trim(),q:parseAmt(l.q)||0,p:parseAmt(l.p),pid:l.pid||null,c:(()=>{const pr=l.pid&&S.products.find(z=>z.id===l.pid);return pr&&pr.cost>0?pr.cost:0;})()})).filter(l=>l.q>0&&l.p>0);
  const total=lines.reduce((s,l)=>s+l.q*l.p,0);
  if(!lines.length||total<=0){ d.err=t("err_total"); $("#s-err").textContent=d.err; return; }
  { const dd=DETDATE[biz()]; if(dd&&!S.shop.allowPast){ for(const l of lines){ const f=[l.sn,l.w]; for(let n=0;n<2;n++) if(dd[n]&&isIso(f[n])&&f[n]<todayKey()){ d.err=lx("Cette date ne peut pas être dans le passé.","This date cannot be in the past."); $("#s-err").textContent=d.err; return; } } } }
  if(biz()==="hotel"){ const used=[]; for(const l of lines){ if(!l.ci&&!l.co) continue;
    if(!l.ci||!l.co||l.co<=l.ci){ d.err=lx("Choisissez une date d'arrivée et une date de départ après l'arrivée.","Choose a check-in date and a check-out date after it."); $("#s-err").textContent=d.err; return; }
    if(l.ci<todayKey()&&!S.shop.allowPast){ d.err=lx("La date d'arrivée ne peut pas être dans le passé. Choisissez aujourd'hui ou une date à venir.","Check-in cannot be in the past. Choose today or a later date."); $("#s-err").textContent=d.err; return; }
    if(daysBetween(l.ci,l.co)>365){ d.err=lx("Un séjour ne peut pas dépasser 365 nuits.","A stay cannot be longer than 365 nights."); $("#s-err").textContent=d.err; return; }
    if(l.pid){ const pr=S.products.find(x=>x.id===l.pid), total=Math.max(1,+(pr&&pr.rooms)||1), clash=roomsBooked(l.pid,l.ci,l.co)+used.filter(u=>u.pid===l.pid&&u.ci<l.co&&u.co>l.ci).length;
      if(clash>=total){ d.err=lx(`${l.d} est déjà réservée du ${fmtDay(l.ci)} au ${fmtDay(l.co)}. Choisissez d'autres dates ou une autre chambre.`,`${l.d} is already booked for ${fmtDay(l.ci)} to ${fmtDay(l.co)}. Choose other dates or another room.`); $("#s-err").textContent=d.err; return; }
      used.push(l); } } }
  if(d.mode!=="full"&&d.due&&d.due<todayKey()&&!S.shop.allowPast){ d.err=lx("La date limite ne peut pas être dans le passé.","The due date cannot be in the past."); $("#s-err").textContent=d.err; return; }
  const need={}; lines.forEach(l=>{ if(l.pid) need[l.pid]=(need[l.pid]||0)+l.q; });
  for(const pid in need){ const pr=S.products.find(x=>x.id===pid); if(pr&&!pr.svc&&need[pid]>sellable(pr)){ d.err=t("err_stock",pr.name,sellable(pr)); $("#s-err").textContent=d.err; return; } }
  let paid=draftPaid(); if(paid>total) paid=total;
  let custId=d.cust||null;
  if(d.newCust){
    if(!d.nc.name.trim()){ d.err=t("err_name"); $("#s-err").textContent=d.err; return; }
    const c={id:uid(),name:d.nc.name.trim(),phone:d.nc.phone.trim(),created:new Date().toISOString()};
    S.customers.push(c); custId=c.id;
  }
  if(!custId&&total-paid>0.001){ d.err=t("err_cust"); $("#s-err").textContent=d.err; return; }
  const x={id:uid(),no:++S.counter,type:"sale",cust:custId,date:new Date().toISOString(),lines,total,paid,...(paid>0?{method:d.method||S.shop.lastMethod||"cash"}:{}),due:(total-paid>0.001&&/^\d{4}-\d{2}-\d{2}$/.test(d.due||""))?d.due:"",note:d.note.trim(),by:me()?me().name:""};
  for(const pid in need){ const pr=S.products.find(y=>y.id===pid); if(pr&&!pr.svc) pr.qty=Math.round((pr.qty-need[pid])*1000)/1000; }
  if(expOn()) x.lines.forEach(l=>{ const pr=l.pid&&S.products.find(y=>y.id===l.pid); if(!pr||pr.svc) return; const bt=takeBatches(pr,l.q); if(bt.length){ l.bt=bt; const ns=[...new Set(bt.map(b=>b.n).filter(Boolean))]; if(ns.length) l.sn=ns.join(", "); else delete l.sn; const es=bt.map(b=>b.e).filter(Boolean).sort(); if(es.length) l.w=fmtExp(es[0]); else delete l.w; } });
  if(x.method) S.shop.lastMethod=x.method;
  if(d.job){ const jb=(S.jobs||[]).find(z=>z.id===d.job&&!z.gone); if(jb){ x.job=jb.id; jb.sale=x.id; jb.st="prog"; jb.u=Date.now(); } }
  S.txs.push(x); save();
  ui.draft=null; ui.modal={type:"receipt",id:x.id,kind:kind==="invoice"?"invoice":"receipt"}; ui.view="home"; render(); toast(t("created"));

}
function csvOf(){
  const q=v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`;
  const rows=[["no","date","type","customer","items","total","paid","payment_amount","method","note","cancelled"]];
  [...S.txs].sort((a,b)=>a.no-b.no).forEach(x=>rows.push([x.no,x.date,x.type,custName(x.cust),
    x.type==="sale"?x.lines.map(l=>`${l.q} x ${l.d} @ ${l.p}${lnEx(l)?" ["+lnEx(l)+"]":""}`).join("; "):"",x.total??"",x.paid??"",x.amount??"",x.method||"",x.note||"",x.void?"yes":""]));
  return "﻿"+rows.map(r=>r.map(q).join(",")).join("\r\n");
}

    case "bc-back": ui.view="cust"; render(); break;
    case "bc-tpl": bcState().text=BC_TPL[L()][el.dataset.k]; render(); break;
    case "bc-aud": bcState().aud=el.dataset.k; render(); break;
    case "bc-copy": copyText(bcState().text.replace(/\s*\{name\}/g,"").replace(/\{shop\}/g,S.shop.name)); break;
    case "bc-sent": { const b=bcState(); b.sent[el.dataset.bcid]=1; el.textContent=t("bc_sent");
      const list=bcAudience(b.aud); const pr=$("#bc-progress"); if(pr) pr.textContent=t("bc_progress",list.filter(c=>b.sent[c.id]).length,list.filter(c=>intlPhone(c.phone)).length); break; }
    case "edit-cust": ui.modal={type:"editcust",id}; renderModal(); break;
    case "save-ecust": { const c=custById(id), n=$("#ec-name").value.trim(); if(!n){ $("#ec-err").textContent=t("err_name"); break; } if(phoneBad($("#ec-phone").value)){ $("#ec-err").textContent=PHBAD(); break; }
      c.name=n; c.phone=$("#ec-phone").value.trim(); if($("#ec-rent")){ c.unit=$("#ec-unit").value.trim(); c.rent=parseAmt($("#ec-rent").value)||0; } if($("#ec-cls")){ const v=$("#ec-cls").value.trim(); if(v) c.cls=v; else delete c.cls; } if($("#ec-memo")){ const v=$("#ec-memo").value.trim(); if(v) c.memo=v; else delete c.memo; } save(); ui.modal=null; render(); toast(t("saved_ok")); break; }
    case "ask-cancel": ui.modal={type:"cancel",id}; renderModal(); break;
    case "do-cancel": voidTx(id); break;
    case "rep-period": ui.repPeriod=el.dataset.p; ui.repOff=0; render(); break;
    case "rep-prev": ui.repOff--; render(); break;
    case "rep-next": if(ui.repOff<0) ui.repOff++; render(); break;
    case "close-modal": ui.modal=null; renderModal(); break;
    case "save-settings": {
      const s=S.shop, oldC=s.country;
      s.name=$("#s-name").value.trim()||"Ma Boutique"; s.phone=$("#s-phone").value.trim(); s.address=($("#s-addr").value||"").trim();
      s.country=$("#s-country").value; s.lang=$("#s-lang").value; s.footer=$("#s-footer").value.trim(); { const tx=$("#s-tax").value.trim().slice(0,40); if(tx) s.taxId=tx; else delete s.taxId; }
      s.lateDays=Math.max(1,parseInt($("#s-late").value,10)||14);
      s.biz=$("#s-biz").value; try{ localStorage.setItem("ecrici-biz",s.biz); }catch(e){}
      if($("#s-past").checked) s.allowPast=true; else delete s.allowPast;
      nicheExamples();
      if(oldC!==s.country&&!$("#s-lang").dataset.touched) {}
      save(); render(); toast(t("saved_ok")); break; }
    case "save-cat": saveCat(); break;
    case "go-cat": ui.view="set"; render(); setTimeout(()=>{ const b=$("#cat-box"); if(b) b.scrollIntoView({block:"start"}); },60); break;
    case "logo-rm": delete S.shop.logoData; save(); render(); break;
    case "cat-col": catGrab(); catPatch({color:el.dataset.c}); break;
    case "cat-img-rm": { catGrab(); const k=el.dataset.k, old=(S.shop.cat||{})[k]; if(old&&window.__catImgDel) window.__catImgDel(old); const n=Object.assign({},S.shop.cat); delete n[k]; S.shop.cat=n; catPatch({}); break; }
    case "dtag": { const m=ui.modal, k=el.dataset.k; if(m&&m.dt){ const i=m.dt.indexOf(k); if(i<0) m.dt.push(k); else m.dt.splice(i,1); el.setAttribute("aria-pressed",String(i<0)); } break; }
    case "tagfill": { const e=$("#c-tag"); if(e){ e.value=el.dataset.v; } break; }
    case "ph-first": { const m=ui.modal, i=+el.dataset.i; if(m&&m.ph&&i>0){ m.ph.unshift(m.ph.splice(i,1)[0]); phRefresh(); } break; }
    case "ph-del": { const m=ui.modal, i=+el.dataset.i; if(m&&m.ph){ const e=m.ph.splice(i,1)[0]; try{ if(e&&e.pv) URL.revokeObjectURL(e.pv); }catch(_){} phRefresh(); } break; }
    case "gal-del": { catGrab(); const c=S.shop.cat||{}, g=(c.gal||[]).slice(), i=+el.dataset.i, u=g.splice(i,1)[0]; if(u&&window.__catImgDel) window.__catImgDel(u); catPatch({gal:g}); break; }
    case "img-rm": { const m=ui.modal; if(m){ m.rmImg=true; delete m.blob; m.prev=""; const im=$("#pr-prev"); if(im) im.style.display="none"; el.hidden=true; } break; }
    case "cat-qr": ui.modal={type:"catqr"}; renderModal(); break;
    case "cat-qr-print": { const im=$("#qr-img"); if(im) printHtml(S.shop.name,`<div style="text-align:center;font-family:system-ui,sans-serif;padding:24px"><div style="font-size:26px;font-weight:800">${esc(S.shop.name)}</div><div style="font-size:18px;margin:8px 0 18px">${lx("Scannez pour voir nos prix et commander","Scan to see our prices and order")}</div><img src="${im.src}" style="width:320px;height:320px"><div style="font-size:13px;color:#667;margin-top:14px">${esc(catUrl())}</div></div>`); break; }
    case "cat-copy": copyText(catUrl()); break;
    case "cat-wa": { const c=S.shop.cat; window.open("https://wa.me/?text="+encodeURIComponent((lx("Voici mes prix et mes articles : ","See my prices and items here: "))+catUrl()),"_blank","noopener"); break; }
    case "save-pay": { const out=[]; for(let i=0;i<3;i++){ const n=($("#pay-n-"+i)||{}).value||""; if(n.trim()) out.push({m:($("#pay-m-"+i)||{}).value||"Other",n:n.trim().slice(0,60),a:(($("#pay-a-"+i)||{}).value||"").trim().slice(0,60)}); }
      S.shop.pay=out; S.shop.payinfo=""; save(); render(); toast(t("saved_ok")); break; }
    case "go-pay": ui.modal=null; $("#layer").innerHTML=""; ui.view="set"; render(); setTimeout(()=>{ const b=$("#pay-box"); if(b) b.scrollIntoView({block:"start"}); },50); break;
    case "tour-next": if(ui.tour){ ui.tour.i++; drawTour(); } break;
    case "tour-back": if(ui.tour){ ui.tour.i=Math.max(0,ui.tour.i-1); drawTour(); } break;
    case "tour-skip": tourClose(); break;
    case "tour-try": tourClose(); loadExamples(); break;
    case "tour-own": tourClose(); ui.view="stock"; render(); break;
    case "tour-open": ui.tour={i:0}; drawTour(); break;
    case "backup-now": backupNow(); break;
    case "theme": setTheme(el.dataset.m); break;
    case "export-csv": saveFile(`ecrici-${todayKey()}.csv`,csvOf()); break;
    case "reset": ui.confirmReset=true; render(); break;
    case "reset-no": ui.confirmReset=false; render(); break;
    case "reset-yes": S=blank(); ui.confirmReset=false; ui.custId=null; ui.view="home"; save(); render(); break;
  }
});
/* sms: links cannot open from inside a framed page (it blanks the page). When framed, copy the message instead. */
document.addEventListener("click",async e=>{
  const a=e.target.closest&&e.target.closest('a[href^="sms:"]'); if(!a) return;
  let framed=false; try{ framed=window.self!==window.top; }catch(_){ framed=true; }
  if(!framed) return;
  e.preventDefault();
  const href=a.getAttribute("href"), q=href.indexOf("?body=");
  const to=href.slice(4,q<0?undefined:q), body=q<0?"":decodeURIComponent(href.slice(q+6));
  await copyText(body);
  toast(L()==="fr"?`Message copié. Ouvrez vos SMS, écrivez à ${to||"votre client"} et collez.`:`Message copied. Open your SMS app, write to ${to||"your customer"} and paste.`);
},true);
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="pk-inline"){ ui.draft.pq=el.value; const B=$("#pk-inl"); if(B) B.innerHTML=pickList(el.value,true); pkVis(); return; }
  if(el.id==="pk-q"){ const L=$("#pk-list"); if(L) L.innerHTML=pickList(el.value); return; } if(!el.dataset||!el.dataset.bind) return;
  const r=setBind(el.dataset.bind,el.value);
  if(r==="search"||r==="hsearch"){ const pos=el.selectionStart; render(); const n=$("#"+el.id); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(_){} } return; }
  updateSaleTotals();
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.bind==="cust"){ setBind("cust",el.value); }
  if(el.id==="pr-img"&&el.files&&el.files[0]&&ui.modal&&ui.modal.type==="product"){ const m=ui.modal, files=[...el.files]; el.value="";
    const room=Math.min(PHMAX-m.ph.length, PHSHOP-phTotal(m.id)-m.ph.length); if(room<=0){ toast(lx("Limite de photos atteinte.","Photo limit reached.")); return; }
    (async()=>{ let bad=0; for(const f of files.slice(0,room)){ await new Promise(r=>resizeImg(f,800,b=>{ if(!b||b.size>280000){ bad++; return r(); } m.ph.push({b,pv:URL.createObjectURL(b)}); r(); })); }
      if(files.length>room) toast(lx("Seulement "+room+" photo(s) ajoutée(s) (limite).","Only "+room+" photo(s) added (limit)."));
      else if(bad) toast(lx("Une photo était illisible ou trop lourde.","A photo was unreadable or too large."));
      phRefresh(); })(); }
  if(el.id==="c-cityp"){ const h=$("#c-city"); if(h){ if(el.value==="~"){ h.style.display=""; h.value=""; h.focus(); } else { h.style.display="none"; h.value=el.value; } } }
  if(el.id==="c-hrsp"){ const h=$("#c-hrs"); if(h){ if(el.value==="~"){ h.style.display=""; h.value=""; h.focus(); } else { h.style.display="none"; h.value=el.value; } } }
  if(el.id==="c-gal"&&el.files&&el.files[0]){ const files=[...el.files]; el.value=""; catGrab(); const c=S.shop.cat||{}, g=(c.gal||[]).slice(), room=PHGAL-g.length; if(room<=0) return;
    toast(lx("Envoi des photos…","Uploading photos…"));
    (async()=>{ let bad=0; for(const f of files.slice(0,room)){ const b=await new Promise(r=>resizeImg(f,1000,r)); if(!b||b.size>280000){ bad++; continue; } const u=await (window.__catImg?window.__catImg(b,"g").catch(()=>null):null); if(u) g.push(u); else bad++; }
      catPatch({gal:g}); if(bad) toast(lx(bad+" photo(s) non envoyée(s).",bad+" photo(s) not sent.")); })(); }
  if(el.id==="s-logo"&&el.files&&el.files[0]){ resizeImg(el.files[0],160,b=>{ if(!b||b.size>40000){ toast(lx("Photo illisible ou trop lourde.","Photo unreadable or too large.")); return; } const fr=new FileReader(); fr.onload=()=>{ S.shop.logoData=fr.result; save(); render(); toast(lx("Logo ajouté","Logo added")); }; fr.readAsDataURL(b); },true); }
  if((el.id==="c-logo"||el.id==="c-cover")&&el.files&&el.files[0]){ const k=el.id.slice(2); catGrab(); toast(lx("Envoi de la photo…","Uploading photo…"));
    resizeImg(el.files[0],k==="logo"?256:1000,b=>{ if(!b||b.size>280000){ toast(lx("Photo illisible ou trop lourde. Essayez-en une autre.","Photo unreadable or too large. Try another.")); return; }
      const old=(S.shop.cat||{})[k]; (window.__catImg?window.__catImg(b,k,old):Promise.resolve(null)).then(url=>{ if(url) catPatch({[k]:url}); else toast(lx("Photo non envoyée (pas d'internet ?). Réessayez.","Photo not sent (no internet?). Try again.")); }).catch(()=>toast(lx("Photo non envoyée. Réessayez.","Photo not sent. Try again."))); }); }
  if(el.id==="s-country"){ const l=$("#s-lang"); if(l) l.value=COUNTRIES[el.value].lang; }
  if(el.id==="f-import"&&el.files&&el.files[0]){
    const fr=new FileReader();
    fr.onload=()=>{ try{ const p=JSON.parse(fr.result); if(!p||!p.shop||!Array.isArray(p.txs)||!Array.isArray(p.customers)) throw 0;
      S=migrate(p); save(); ui.view="home"; render(); toast(t("imported")); }catch(_){ toast(t("bad_file")); } };
    fr.readAsText(el.files[0]);
  }
});
document.addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target.id==="pk-inline"&&ui.draft){ e.preventDefault(); const f=document.querySelector("#pk-inl [data-act=pick-p]"); if(f){ pickAdd(f.dataset.id); ui.draft.pq=""; e.target.value=""; refreshPicks(); } return; } if(e.key==="Escape"&&ui.modal){ ui.modal=null; renderModal(); } if(e.key==="Enter"&&e.target.id==="lk-pin") doUnlock(); });

function blank(){ return {v:1,updated:Date.now(),counter:0,shop:{name:"Ma Boutique",phone:"",country:"BJ",lang:"fr",footer:"",lateDays:14,staffOn:false,recovery:""},customers:[],txs:[],products:[],staff:[],expenses:[],expRules:[]}; }

/* ---------- boot ---------- */
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
S=load()||seed();
applyTheme();
if(!load()) save();
render();
initCloud();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
