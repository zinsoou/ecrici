<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: a notebook-style ledger. Header with shop name, one scrolling column, fixed tab bar at the bottom. */
:root{
  --paper:#f3f5fa;
  --card:#ffffff;
  --ink:#16203f;
  --muted:#5d6784;
  --line:#dde2ee;
  --accent:#2447d6;
  --accent-ink:#ffffff;
  --owed:#b4321f;
  --owed-bg:#fbe9e5;
  --paid:#17714a;
  --paid-bg:#e2f4ea;
  --warn-bg:#fff3d1;
  --warn-ink:#6b4b00;
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f1527;--card:#171f38;--ink:#e8ecf8;--muted:#9aa5c6;--line:#2a3558;
    --accent:#7d97ff;--accent-ink:#0c1230;--owed:#ff9a88;--owed-bg:#3a1c1a;--paid:#6fd9a2;--paid-bg:#14301f;
    --warn-bg:#3b2f0d;--warn-ink:#f3d78a;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f1527;--card:#171f38;--ink:#e8ecf8;--muted:#9aa5c6;--line:#2a3558;
  --accent:#7d97ff;--accent-ink:#0c1230;--owed:#ff9a88;--owed-bg:#3a1c1a;--paid:#6fd9a2;--paid-bg:#14301f;
  --warn-bg:#3b2f0d;--warn-ink:#f3d78a;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 96px;
}
.wrap{max-width:720px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono,.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.num{font-weight:500}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px;flex-wrap:wrap}
.brand{min-width:0}
.brand h1{font-size:1.5rem;line-height:1.1;overflow-wrap:anywhere}
.brand small{color:var(--muted);font-size:.8rem}
.chips{display:flex;gap:8px;align-items:center}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.82rem;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.status{font-size:.75rem;color:var(--muted)}

/* banner */
.banner{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:6px 0 14px;font-size:.9rem}

/* sections */
.sec{margin-top:22px;display:grid;gap:10px}
.sec>h2{font-size:1.05rem;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec>h2 span{font-family:var(--font-body);font-weight:500;font-size:.8rem;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.card.flush{padding:0;overflow:hidden}

/* summary */
.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sum .card{min-width:0}
.sum .lbl{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sum .val{font-size:1.15rem;margin-top:4px;overflow-wrap:anywhere}
.sum .owed .val{color:var(--owed)}
.sum .got .val{color:var(--paid)}

/* rows */
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-width:0;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .name{font-weight:600;overflow-wrap:anywhere}
.row .sub{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.row .amt{text-align:right;white-space:nowrap}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.74rem;font-weight:600}
.badge.owed{background:var(--owed-bg);color:var(--owed)}
.badge.paid{background:var(--paid-bg);color:var(--paid)}
.badge.late{background:var(--warn-bg);color:var(--warn-ink)}
.empty{padding:22px 14px;color:var(--muted);text-align:center}

/* forms */
.form{display:grid;gap:14px}
.field{display:grid;gap:6px;min-width:0}
.field>label,.lab{font-size:.8rem;color:var(--muted);font-weight:600;letter-spacing:.03em}
input,select,textarea{width:100%;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
input[type=number]{font-family:var(--font-mono)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lines{display:grid;gap:10px}
.line{display:grid;grid-template-columns:76px minmax(0,1fr) 40px;gap:8px;align-items:center}
.line>input:first-child{grid-column:1/-1}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--owed);border-color:var(--owed)}
.btn.small{padding:6px 10px;min-height:34px;font-size:.85rem}
.btn.ghost{background:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.x{border:0;background:none;color:var(--muted);font-size:1.3rem;cursor:pointer;min-height:36px}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-top:6px;border-top:2px solid var(--ink)}
.total .num{font-size:1.4rem}
.err{color:var(--owed);font-size:.88rem;min-height:1.2em}
.note{color:var(--muted);font-size:.85rem}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
.tabs button{background:none;border:0;padding:8px 2px;border-radius:10px;cursor:pointer;color:var(--muted);font-size:.7rem;font-weight:600;min-width:0}
.tabs button[aria-current="page"]{color:var(--accent);background:var(--paper)}
.tabs svg{display:block;margin:0 auto 3px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* modal + receipt */
.veil{position:fixed;inset:0;background:rgba(10,14,30,.55);z-index:20;overflow-y:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{max-width:440px;margin:0 auto;display:grid;gap:12px}
.dlg{background:var(--card);border-radius:14px;padding:16px;display:grid;gap:12px}
.ticket{background:var(--card);border-radius:14px;padding:22px 20px;font-family:var(--font-body);font-size:.95rem;line-height:1.5}
.ticket .hd{text-align:center;padding-bottom:14px;border-bottom:1px solid var(--line)}
.ticket h3{font-family:var(--font-display);font-size:1.4rem;letter-spacing:.02em;text-transform:uppercase;overflow-wrap:anywhere}
.ticket .sub{color:var(--muted);font-size:.88rem}
.ticket .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:12px 0;border-bottom:1px dashed var(--line);font-size:.88rem;color:var(--muted)}
.ticket .meta b{color:var(--ink);font-weight:600}
.ticket .who{padding:12px 0 4px;font-size:.95rem}
.ticket .who span{color:var(--muted)}
.ticket table{width:100%;border-collapse:collapse;margin:6px 0}
.ticket th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;text-align:left;padding:6px 0;border-bottom:1px solid var(--line)}
.ticket td{padding:7px 0;vertical-align:top;text-align:left;border-bottom:1px solid var(--line)}
.ticket td.r,.ticket th.r{text-align:right;white-space:nowrap;padding-left:10px;font-variant-numeric:tabular-nums}
.ticket .tot{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
.ticket .tot.grand{font-size:1.15rem;font-weight:700;border-top:2px solid var(--ink);margin-top:6px;padding-top:10px}
.ticket .owe{display:flex;justify-content:space-between;gap:10px;margin-top:10px;padding:10px 12px;border:1px solid var(--owed);border-radius:10px;color:var(--owed);font-weight:600}
.ticket .note2{margin-top:8px;font-size:.88rem;color:var(--muted)}
.ticket .bal{margin-top:10px;font-size:.88rem;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.ticket .bal b{color:var(--ink)}
.ticket .thanks{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line);text-align:center;color:var(--muted);font-size:.9rem}
.msg{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.92rem}
a.btn{text-decoration:none;display:inline-flex;align-items:center;color:inherit}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:14px;font-size:.88rem;line-height:1.35;text-align:center;z-index:30;width:max-content;max-width:min(92vw,360px)}
.hint{grid-column:1/-1;font-size:.78rem;color:var(--muted);margin-top:-4px}.hint:empty{display:none}
.lock{max-width:380px;margin:12vh auto 0}
.pin{letter-spacing:.5em;font-family:var(--font-mono);text-align:center}
.code{font-family:var(--font-mono);font-size:1.1rem;letter-spacing:.15em}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:6px}
.bars .b{flex:1;min-width:0;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.bars .b.zero{background:var(--line)}
.blabels{display:flex;gap:3px;margin-top:4px}
.blabels span{flex:1;min-width:0;font-size:.62rem;color:var(--muted);display:flex;justify-content:center;overflow:visible;white-space:nowrap}
.row.voided .name,.row.voided .amt .num{text-decoration:line-through;opacity:.6}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.stat:first-child{border-top:0}.stat>span:first-child{min-width:0;overflow-wrap:anywhere}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav .lbl2{flex:1;text-align:center;font-weight:600;text-transform:capitalize;min-width:0;overflow-wrap:anywhere}
.up{color:var(--paid)}.down{color:var(--owed)}

@media (prefers-reduced-motion:no-preference){.veil{animation:fade .12s ease-out}@keyframes fade{from{opacity:0}to{opacity:1}}}
</style>
</head>

function money(n){
  n = Number(n)||0;
  const c=C();
  const s = new Intl.NumberFormat(L()==="fr"?"fr-FR":"en-NG",{maximumFractionDigits:c.sym==="FCFA"?0:2}).format(n).replace(/[  ]/g," ");
  return c.after ? `${s} ${c.sym}` : `${c.sym} ${s}`;
}
function parseAmt(v){ const n=parseFloat(String(v||"").replace(/[\s,]/g,"").replace(",",".")); return isFinite(n)?n:0; }
function fmtDate(iso){
  const d=new Date(iso);
  return d.toLocaleDateString(L()==="fr"?"fr-FR":"en-GB",{day:"2-digit",month:"short",year:"numeric"})+" "+
         d.toLocaleTimeString(L()==="fr"?"fr-FR":"en-GB",{hour:"2-digit",minute:"2-digit"});
}
function daysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); d.setHours(10,0,0,0); return d.toISOString(); }

function balanceOf(custId, uptoNo){
  let b=0;
  for(const x of S.txs){ if(x.cust!==custId||x.void) continue; if(uptoNo&&x.no>uptoNo) continue;
    b += x.type==="sale" ? x.total-x.paid : -x.amount; }
  return Math.round(b*100)/100;
}
/* unpaid sales, payments applied oldest first */
function unpaidSales(custId){
  const mine=S.txs.filter(x=>x.cust===custId&&!x.void).sort((a,b)=>a.no-b.no);
  let pool=mine.filter(x=>x.type==="payment").reduce((s,x)=>s+x.amount,0); const out=[];
  for(const x of mine){ if(x.type!=="sale") continue; let owe=x.total-x.paid;
    if(owe<=0) continue; const use=Math.min(pool,owe); pool-=use; owe-=use; if(owe>0.001) out.push({x,owe}); }
  return out;
}
function oldestUnpaid(custId){ const u=unpaidSales(custId); return u.length?u[0].x.date:null; }
function overdueInfo(custId){
  const tk=todayKey(), o=unpaidSales(custId).filter(u=>u.x.due&&u.x.due<tk); if(!o.length) return null;
  const first=o.reduce((m,u)=>u.x.due<m.x.due?u:m);
  return {due:first.x.due,days:Math.max(1,Math.round((new Date(tk)-new Date(first.x.due))/864e5)),owe:o.reduce((s,u)=>s+u.owe,0)};
}
function nextDue(custId){ const d=unpaidSales(custId).filter(u=>u.x.due).map(u=>u.x.due).sort(); return d.length?d[0]:null; }
const fmtDay=iso=>new Date(iso+"T12:00:00").toLocaleDateString(L()==="fr"?"fr-FR":"en-GB",{day:"2-digit",month:"short",year:"numeric"});
function statementText(c){
  const loc=L()==="fr"?"fr-FR":"en-GB", dshort=iso=>new Date(iso).toLocaleDateString(loc,{day:"2-digit",month:"2-digit"});
  const mine=S.txs.filter(x=>x.cust===c.id&&!x.void).sort((a,b)=>a.no-b.no), last=mine.slice(-12);
  const out=[`${t("st_title")} - ${S.shop.name}`,`${t("st_client")}: ${c.name}`,`${t("st_date")}: ${new Date().toLocaleDateString(loc)}`,""];
  if(mine.length>last.length) out.push("…");
  last.forEach(x=>{ out.push(x.type==="sale"?`${dshort(x.date)}  ${t("st_sale")} #${String(x.no).padStart(4,"0")}  ${money(x.total)}`+(x.total-x.paid>0.001?` (${t("st_left")} ${money(x.total-x.paid)})`:""):`${dshort(x.date)}  ${t("st_pay")} #${String(x.no).padStart(4,"0")}  -${money(x.amount)}`); });
  out.push("",`${t("st_bal")}: ${money(Math.max(0,balanceOf(c.id)))}`);
  const o=overdueInfo(c.id); if(o) out.push(`${t("st_over")} ${fmtDay(o.due)}`);
  return out.join("\n");
}
function saveExpense(){
  const lab=($("#ex-label").value||"").trim(), amt=parseAmt($("#ex-amt").value), dv=$("#ex-date").value, er=$("#ex-err");
  if(!lab||amt<=0){ er.textContent=t("err_exp"); return; }
  const date=/^\d{4}-\d{2}-\d{2}$/.test(dv)?new Date(dv+"T12:00:00").toISOString():new Date().toISOString();
  const fq=($("#ex-rep")||{}).value||"0", dk=/^\d{4}-\d{2}-\d{2}$/.test(dv)?dv:todayKey();
  const ex={id:uid(),date,amount:amt,label:lab}; (S.expenses=S.expenses||[]).push(ex);
  if(fq!=="0"){ const f=fq==="1"?"week":fq==="2"?"month":"year"; const rule={id:uid(),label:lab,amount:amt,freq:f,anchor:dk,next:nextDue2(dk,f,dk)}; ex.rule=rule.id; (S.expRules=S.expRules||[]).push(rule); }
  save(); ui.modal=null; render(); toast(t("created"));
}
function nextDue2(anchor,freq,cur){
  const [ay,am,ad]=anchor.split("-").map(Number), [cy,cm,cd]=cur.split("-").map(Number);
  let y=cy,m=cm,d=cd;
  if(freq==="week"){ const x=new Date(cy,cm-1,cd+7); return dkey(x); }
  if(freq==="month"){ m=cm+1; if(m>12){ m=1; y=cy+1; } } else { y=cy+1; m=am; }
  const dim=new Date(y,m,0).getDate(); d=Math.min(ad,dim);
  return y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");
}
function applyRules(){
  const tk=todayKey(); let ch=false;
  for(const r of (S.expRules||[])){
    let n=0;
    while(r.next<=tk&&n<60){ (S.expenses=S.expenses||[]).push({id:uid(),date:new Date(r.next+"T12:00:00").toISOString(),amount:r.amount,label:r.label,rule:r.id}); r.next=nextDue2(r.anchor,r.freq,r.next); n++; ch=true; }
  }
  return ch;
}

  return o?t("msg_remind_due",c.name,S.shop.name,money(balanceOf(c.id)),fmtDay(o.due)):t("msg_remind",c.name,S.shop.name,money(balanceOf(c.id)));
}

/* ---------- phone helpers ---------- */
function intlPhone(raw){
  const plus=/^\s*(\+|00)/.test(String(raw||""));
  let d=String(raw||"").replace(/\D/g,""); if(!d) return "";
  const cc=C().cc;
  if(d.startsWith("00")) d=d.slice(2);
  if(plus&&!d.startsWith(cc)) return d;
  if(S.shop.country==="BJ"&&d.startsWith(cc)&&d.length===cc.length+8) return cc+"01"+d.slice(cc.length);
  if(d.startsWith(cc)&&d.length>=cc.length+8) return d;
  if(S.shop.country==="BJ"){ if(d.length===8) d="01"+d; return cc+d; }
  return cc+d.replace(/^0+/,"");
}

/* ---------- persistence ---------- */
let saveTimer=null, cloud=null, cloudBusy=false, cloudDirty=false;
function save(){
  S.updated=Date.now();
  try{ localStorage.setItem(LS_KEY,JSON.stringify(S)); }catch(e){}
  clearTimeout(saveTimer); saveTimer=setTimeout(pushCloud,1200);
}
async function pushCloud(){
  if(!cloud) return;
  if(cloudBusy){ cloudDirty=true; return; }
  cloudBusy=true;
  try{
    const json=JSON.stringify(S);
    if(json.length>230000) throw new Error("too large");
    await cloud.set({json,updated:S.updated});
    storeMode="account";
  }catch(e){ storeMode="device"; }
  cloudBusy=false; updateStatus();
  if(cloudDirty){ cloudDirty=false; pushCloud(); }
}
async function initCloud(){
  try{
    if(!window.claude||!claude.use) return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    const ref=db.doc("data/users/"+id+"/ledger");
    const snap=await ref.get();
    cloud=ref;
    if(snap.exists){
      const d=snap.data();
      if(d&&d.json&&d.updated>(S.updated||0)){
        try{ const parsed=JSON.parse(d.json); if(parsed&&parsed.shop){ S=migrate(parsed); try{localStorage.setItem(LS_KEY,d.json);}catch(e){} render(); } }catch(e){}
      }else{ pushCloud(); }
    }else{ pushCloud(); }
    storeMode="account"; updateStatus();
  }catch(e){ cloud=null; storeMode="device"; updateStatus(); }
}
function migrate(p){
  p.products=p.products||[]; p.staff=p.staff||[]; p.expenses=p.expenses||[]; p.expRules=p.expRules||[]; p.shop.staffOn=!!p.shop.staffOn; p.shop.recovery=p.shop.recovery||""; p.shop.lastBackup=p.shop.lastBackup||"";
  if(p.shop.staffOn&&!p.staff.length) p.shop.staffOn=false;
  p.txs.forEach(x=>{ if(x.type==="sale") x.lines.forEach(l=>{ if(!("pid" in l)) l.pid=null; if(x.example&&l.c===undefined) l.c=EX_COST[l.d]||0; }); });
  p.products.forEach(q=>{ if(q.cost===undefined) q.cost=q.example?(EX_COST[q.name]||0):0; });
  return p;
}
const THEME_KEY="cahier-theme", hostTheme=document.documentElement.getAttribute("data-theme");
function getTheme(){ try{ return localStorage.getItem(THEME_KEY)||"auto"; }catch(e){ return ui.themeMem||"auto"; } }
function applyTheme(){
  const m=getTheme(), r=document.documentElement;
  if(m==="light"||m==="dark") r.setAttribute("data-theme",m);

let toastTimer=null;
function toast(msg){ const el=$("#toast"); el.textContent=msg; el.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>{el.hidden=true;},2200); }
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); toast(t("copied")); return; }catch(e){}
  const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");toast(t("copied"));}catch(e){} ta.remove();
}
async function saveFile(filename,data){
  try{
    const type=/\.json$/.test(filename)?"application/json":/\.csv$/.test(filename)?"text/csv":"text/plain";
    const blob=new Blob([data],{type:type+";charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const el=document.createElement("a"); el.href=url; el.download=filename; document.body.appendChild(el); el.click(); el.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    return true;
  }catch(e){ toast("—"); return false; }
}
async function backupNow(){
  const prev=S.shop.lastBackup||"";
  S.shop.lastBackup=new Date().toISOString();
  const name=`ecrici-${todayKey()}.json`, json=JSON.stringify(S,null,1);
  let ok=false, cancelled=false;
  try{
    const file=new File([json],name,{type:"application/json"});
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file],title:"Ecrici"}); ok=true; }
      catch(e){ if(e&&e.name==="AbortError") cancelled=true; }
    }
  }catch(e){}
  if(!ok&&!cancelled) ok=await saveFile(name,json);
  if(ok){ save(); render(); toast(t("backup_done")); } else { S.shop.lastBackup=prev; }
}

  const now=Date.now();
  return S.customers.filter(c=>{
    if(aud==="owe") return balanceOf(c.id)>0.001;
    if(aud==="recent") return now-lastBuy(c.id)<=30*864e5&&lastBuy(c.id)>0;
    if(aud==="inactive") return !lastBuy(c.id)||now-lastBuy(c.id)>60*864e5;
    return true; }).sort((a,b)=>a.name.localeCompare(b.name));
}

/* --- reports --- */
function startOf(period,off){
  const n=new Date(); n.setHours(0,0,0,0); let a,b;
  if(period==="day"){ a=new Date(n); a.setDate(a.getDate()+off); b=new Date(a); b.setDate(b.getDate()+1); }
  else if(period==="week"){ a=new Date(n); const wd=(a.getDay()+6)%7; a.setDate(a.getDate()-wd+off*7); b=new Date(a); b.setDate(b.getDate()+7); }
  else if(period==="month"){ a=new Date(n.getFullYear(),n.getMonth()+off,1); b=new Date(a.getFullYear(),a.getMonth()+1,1); }
  else { a=new Date(n.getFullYear()+off,0,1); b=new Date(a.getFullYear()+1,0,1); }
  return [a,b];
}
function rangeLabel(period,a,b){
  const loc=L()==="fr"?"fr-FR":"en-GB";
  if(period==="day") return a.toLocaleDateString(loc,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  if(period==="week"){ const e=new Date(b); e.setDate(e.getDate()-1); return a.toLocaleDateString(loc,{day:"numeric",month:"short"})+" – "+e.toLocaleDateString(loc,{day:"numeric",month:"short",year:"numeric"}); }
  if(period==="month") return a.toLocaleDateString(loc,{month:"long",year:"numeric"});
  return String(a.getFullYear());
}
function stats(a,b){
  const r={sales:0,collected:0,credit:0,debtPaid:0,count:0,profit:0,profitBase:0,expenses:0,expList:[],prod:{},cust:{}};
  for(const x of S.txs){ if(x.void) continue; const d=new Date(x.date); if(d<a||d>=b) continue;
    if(x.type==="sale"){
      r.sales+=x.total; r.collected+=x.paid; r.credit+=x.total-x.paid; r.count++;
      const ck=x.cust||"_walk"; r.cust[ck]=(r.cust[ck]||0)+x.total;
      x.lines.forEach(l=>{ const rev=l.q*l.p; const key=l.pid||("n:"+(l.d||"").toLowerCase());
        const e=r.prod[key]||(r.prod[key]={name:l.d||t("goods"),q:0,rev:0}); e.q+=l.q; e.rev+=rev;
        if(l.c>0){ r.profit+=(l.p-l.c)*l.q; r.profitBase+=rev; } });
    }else{ r.collected+=x.amount; r.debtPaid+=x.amount; } }
  for(const e of (S.expenses||[])){ const d=new Date(e.date); if(d<a||d>=b) continue; r.expenses+=e.amount; r.expList.push(e); }
  r.expList.sort((x,y)=>new Date(y.date)-new Date(x.date));
  return r;
}
function buckets(period,a){
  const loc=L()==="fr"?"fr-FR":"en-GB", out=[];
  if(period==="week"){ for(let i=0;i<7;i++){ const s=new Date(a); s.setDate(s.getDate()+i); const e=new Date(s); e.setDate(e.getDate()+1); out.push({s,e,label:s.toLocaleDateString(loc,{weekday:"narrow"}),full:s.toLocaleDateString(loc,{weekday:"long",day:"numeric",month:"short"})}); } }
  else if(period==="month"){ const days=new Date(a.getFullYear(),a.getMonth()+1,0).getDate(); for(let i=1;i<=days;i++){ const s=new Date(a.getFullYear(),a.getMonth(),i); const e=new Date(a.getFullYear(),a.getMonth(),i+1); out.push({s,e,label:(i===1||i%5===0)?String(i):"",full:s.toLocaleDateString(loc,{day:"numeric",month:"long"})}); } }
  else if(period==="year"){ for(let m=0;m<12;m++){ const s=new Date(a.getFullYear(),m,1); const e=new Date(a.getFullYear(),m+1,1); out.push({s,e,label:s.toLocaleDateString(loc,{month:"narrow"}),full:s.toLocaleDateString(loc,{month:"long",year:"numeric"})}); } }
  return out;
}
function salesBetween(a,b){ let n=0; for(const x of S.txs){ if(x.void||x.type!=="sale") continue; const d=new Date(x.date); if(d>=a&&d<b) n+=x.total; } return n; }
function viewReports(){
  const per=ui.repPeriod, off=ui.repOff, [a,b]=startOf(per,off), st=stats(a,b);
  const [pa,pb]=startOf(per,off-1); const prev=stats(pa,pb).sales;
  const delta=prev>0?Math.round((st.sales-prev)/prev*100):null;
  const periods=[["day","p_day"],["week","p_week"],["month","p_month"],["year","p_year"]];
  let h=`<section class="sec"><h2>${t("reports")}</h2>
    <div class="seg">${periods.map(([k,l])=>`<button class="pill" data-act="rep-period" data-p="${k}" aria-pressed="${per===k}">${t(l)}</button>`).join("")}</div>
    <div class="nav"><button class="btn small" data-act="rep-prev" aria-label="←">←</button><div class="lbl2">${esc(rangeLabel(per,a,b))}</div>
      <button class="btn small" data-act="rep-next" aria-label="→" ${off>=0?"disabled":""}>→</button></div>`;
  h+=`<div class="sum">
    <div class="card"><div style="font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">${t("rep_sales")}</div><div class="val num" style="font-size:1.15rem;margin-top:4px;overflow-wrap:anywhere">${money(st.sales)}</div>
      ${delta!==null&&off<0?`<div class="note ${delta>=0?"up":"down"}">${delta>=0?"+":""}${delta}% ${t("rep_vs")}</div>`:""}</div>
    <div class="card"><div style="font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">${t("rep_profit")}</div>
      <div class="val num" style="font-size:1.15rem;margin-top:4px;overflow-wrap:anywhere;color:${st.profitBase>0?(st.profit>=0?"var(--paid)":"var(--owed)"):"var(--muted)"}">${st.profitBase>0?money(st.profit):"—"}</div>
      <div class="note">${st.profitBase>0?t("rep_profit_note",Math.round(st.profitBase/Math.max(1,st.sales)*100)):t("rep_no_profit")}</div></div></div>`;
  const bk=buckets(per,a);
  if(bk.length){
    const vals=bk.map(x=>salesBetween(x.s,x.e)), mx=Math.max(...vals,0);
    h+=`<div class="card"><div class="note" style="margin-bottom:4px">${t("rep_sales")}${mx>0?` · max ${money(mx)}`:""}</div>
      <div class="bars" role="img" aria-label="${t("rep_sales")}">${vals.map((v,i)=>`<div class="b${v>0?"":" zero"}" style="height:${mx>0?Math.max(2,Math.round(v/mx*100)):2}%" title="${esc(bk[i].full)}: ${esc(money(v))}"></div>`).join("")}</div>
      <div class="blabels">${bk.map(x=>`<span>${esc(x.label)}</span>`).join("")}</div></div>`;
  }
  h+=`<div class="card flush">
    <div class="stat"><span>${t("rep_collected")}</span><span class="num" style="color:var(--paid)">${money(st.collected)}</span></div>
    <div class="stat"><span>${t("rep_credit")}</span><span class="num" style="color:var(--owed)">${money(st.credit)}</span></div>
    <div class="stat"><span>${t("rep_debtpaid")}</span><span class="num">${money(st.debtPaid)}</span></div>
    <div class="stat"><span>${t("rep_count")}</span><span class="num">${st.count}</span></div></div>`;
  h+=`<h2>${t("exp_title")}<button class="btn small primary" data-act="add-expense">${t("exp_add")}</button></h2><div class="card flush">
    <div class="stat"><span>${t("exp_total")}</span><span class="num" style="color:var(--owed)">${money(st.expenses)}</span></div>
    <div class="stat"><span>${t("exp_cash")}</span><span class="num" style="color:${st.collected+st.debtPaid-st.expenses>=0?"var(--paid)":"var(--owed)"}">${money(st.collected+st.debtPaid-st.expenses)}</span></div>
    ${st.profitBase>0?`<div class="stat"><span>${t("exp_net")}</span><span class="num" style="color:${st.profit-st.expenses>=0?"var(--paid)":"var(--owed)"}">${money(st.profit-st.expenses)}</span></div>`:""}
    ${st.expList.length?st.expList.map(e=>`<div class="stat"><span>${esc(e.label)} <span class="note">· ${esc(new Date(e.date).toLocaleDateString(L()==="fr"?"fr-FR":"en-GB",{day:"2-digit",month:"short"}))}</span></span><span class="num">${money(e.amount)} <button class="x" data-act="del-expense" data-id="${e.id}" aria-label="×">×</button></span></div>`).join(""):`<div class="empty">${t("exp_none")}</div>`}</div>
    <p class="note" style="margin:0">${t("exp_cash_note")}${st.profitBase>0?" "+t("exp_net_note"):""}</p>`;
  if((S.expRules||[]).length) h+=`<h2>${t("exp_rules")}</h2><div class="card flush">${S.expRules.map(r=>`<div class="stat"><span>${esc(r.label)} <span class="note">· ${money(r.amount)} ${t(r.freq==="week"?"exp_w":r.freq==="month"?"exp_m":"exp_y")}</span></span><span class="num"><button class="x" data-act="stop-rule" data-id="${r.id}" aria-label="×">×</button></span></div>`).join("")}</div>`;
  if(!st.count){ h+=`<div class="card"><div class="empty">${t("rep_none")}</div></div>`; }
  else{
    const tp=Object.values(st.prod).sort((x,y)=>y.rev-x.rev).slice(0,5);
    const tc=Object.entries(st.cust).sort((x,y)=>y[1]-x[1]).slice(0,5);
    h+=`<h2>${t("rep_top_products")}</h2><div class="card flush">${tp.map(e=>`<div class="stat"><span>${esc(e.name)} <span class="note">· ${e.q} ${t("sold_units")}</span></span><span class="num">${money(e.rev)}</span></div>`).join("")}</div>
      <h2>${t("rep_top_customers")}</h2><div class="card flush">${tc.map(([k,v])=>`<div class="stat"><span>${esc(k==="_walk"?t("walk"):custName(k))}</span><span class="num">${money(v)}</span></div>`).join("")}</div>`;
  }
  return h+`</section>`;
}

function saveProduct(){
  const m=ui.modal, own=isOwner(), er=$("#pr-err"); let p=m.id?S.products.find(x=>x.id===m.id):null;
  if(own){
    const name=$("#pr-name").value.trim(); if(!name){ er.textContent=t("err_pname"); return; }
    if(S.products.some(x=>x.id!==(p&&p.id)&&x.name.toLowerCase()===name.toLowerCase())){ er.textContent=t("err_pdup"); return; }
    const price=parseAmt($("#pr-price").value), qty=parseAmt($("#pr-qty").value), low=Math.max(0,parseAmt($("#pr-low").value));
    const cost=parseAmt(($("#pr-cost")||{}).value);
    if(!p){ p={id:uid(),name,price,qty,low,cost}; S.products.push(p); } else { p.name=name; p.price=price; p.qty=qty; p.low=low; p.cost=cost; }
  }
  if(p){ const ae=$("#pr-add"); const add=ae?parseAmt(ae.value):0; if(add>0) p.qty=Math.round((p.qty+add)*1000)/1000; }
  save(); ui.modal=null; render(); toast(t("product_saved"));
}

/* ---------- receipts & messages ---------- */
const pad4=n=>String(n).padStart(4,"0");
const docTitle=(x,kind)=>`${kind==="invoice"?t("invoice"):t("receipt")} ${t("receipt_no")} ${pad4(x.no)}`;
function receiptLines(x,kind){
  kind=kind||"receipt"; const sh=S.shop; const out=[];
  out.push(sh.name.toUpperCase()); if(sh.phone) out.push(fmtPhone(sh.phone)); if(sh.address) out.push(sh.address);
  out.push(docTitle(x,kind),fmtDate(x.date)); if(x.void) out.push("*** "+t("cancelled").toUpperCase()+" ***"); out.push("");
  out.push(`${t("customer")}: ${custName(x.cust)}`);
  if(x.by) out.push(`${t("served_by")}: ${x.by}`);
  out.push("");
  if(x.type==="sale"){
    x.lines.forEach(l=>out.push(`${l.q} × ${l.d||t("goods")}  ${money(l.q*l.p)}`));
    out.push("-----",`${t("total")}: ${money(x.total)}`,`${t("paid")}: ${money(x.paid)}`);
    if(x.total-x.paid>0.001) out.push(`${kind==="invoice"?t("due"):t("balance_left")}: ${money(x.total-x.paid)}`);
    if(x.due&&x.total-x.paid>0.001) out.push(`${t("due_on")}: ${fmtDay(x.due)}`);
  }else{
    out.push(`${t("payment")} (${t(x.method||"cash")}): ${money(x.amount)}`);
  }
  if(x.note) out.push("",x.note);
  if(x.cust) out.push("-----",`${kind==="invoice"?t("balance_now"):t("balance_after")}: ${money(Math.max(0,balanceOf(x.cust,x.no)))}`);
  out.push("",kind==="invoice"?t("invoice_note"):(sh.footer||t("default_footer")));
  return out;
}
const receiptText=(x,kind)=>receiptLines(x,kind).join("\n");

const fmtPhone=v=>{ v=String(v||"").trim(); return /^\d{10,15}$/.test(v)?"+"+v:v; };
function ticketHtml(x,kind){
  kind=kind||"receipt"; const sh=S.shop; let rows="", owe=x.type==="sale"?x.total-x.paid:0;
  if(x.type==="sale"){
    rows=`<table><thead><tr><th>${t("item")}</th><th class="r">${t("total")}</th></tr></thead><tbody>`+
      x.lines.map(l=>`<tr><td>${esc(l.q)} × ${esc(l.d||t("goods"))}</td><td class="r num">${money(l.q*l.p)}</td></tr>`).join("")+`</tbody></table>
      <div class="tot grand"><span>${t("total")}</span><span class="num">${money(x.total)}</span></div>
      <div class="tot"><span>${t("paid")}</span><span class="num">${money(x.paid)}</span></div>
      ${owe>0.001?`<div class="owe"><span>${kind==="invoice"?t("due"):t("balance_left")}</span><span class="num">${money(owe)}</span></div>`:""}`;
  }else{
    rows=`<div class="tot grand"><span>${t("payment")} · ${t(x.method||"cash")}</span><span class="num">${money(x.amount)}</span></div>`;
  }
  return `<div class="ticket"><div class="hd"><h3>${esc(sh.name)}</h3>${sh.phone?`<div class="sub">${esc(fmtPhone(sh.phone))}</div>`:""}${sh.address?`<div class="sub">${esc(sh.address)}</div>`:""}</div>
    <div class="meta"><b>${docTitle(x,kind)}</b><span>${fmtDate(x.date)}</span></div>
    ${x.void?`<div style="color:var(--owed);font-weight:600;text-align:center;padding:8px 0">— ${t("cancelled").toUpperCase()} —</div>`:""}
    <div class="who"><span>${t("customer")}:</span> <b>${esc(custName(x.cust))}</b></div>
    ${x.by?`<div class="who" style="padding-top:0"><span>${t("served_by")}:</span> ${esc(x.by)}</div>`:""}${rows}
    ${x.due&&x.type==="sale"&&owe>0.001?`<div class="note2">${t("due_on")}: <b>${esc(fmtDay(x.due))}</b></div>`:""}
    ${x.note?`<div class="note2">${esc(x.note)}</div>`:""}
    ${x.cust?`<div class="bal"><span>${kind==="invoice"?t("balance_now"):t("balance_after")}</span><b class="num">${money(Math.max(0,balanceOf(x.cust,x.no)))}</b></div>`:""}
    <div class="thanks">${esc(kind==="invoice"?t("invoice_note"):(sh.footer||t("default_footer")))}</div></div>`;
}

/* ---------- actions ---------- */
function setBind(path,val){
  const d=ui.draft;
  if(path==="search"){ ui.search=val; return "search"; }
  if(path==="hsearch"){ ui.histSearch=val; return "hsearch"; }
  if(path==="bc.text"){ bcState().text=val; updateBc(); return; }
  if(!d) return;
  if(path==="cust") d.cust=val;
  else if(path==="part") d.part=val;
  else if(path==="note") d.note=val;
  else if(path==="due") d.due=val;
  else if(path==="nc.name") d.nc.name=val;
  else if(path==="nc.phone") d.nc.phone=val;
  else if(path.startsWith("line.")){
    const [,i,k]=path.split("."); const l=d.lines[+i]; l[k]=val;
    if(k==="p") l.auto=false;
    if(k==="d"){ const pr=S.products.find(x=>x.name.toLowerCase()===val.trim().toLowerCase()); l.pid=pr?pr.id:null;
      if(pr&&(!parseAmt(l.p)||l.auto)){ l.p=String(pr.price); l.auto=true; const pf=$("#l"+i+"p"); if(pf) pf.value=l.p; } }
    const h=$("#h"+i); if(h) h.textContent=lineHint(l);
  }
}
function saveSale(){
  const d=ui.draft; d.err="";
  const lines=d.lines.map(l=>({d:l.d.trim(),q:parseAmt(l.q)||0,p:parseAmt(l.p),pid:l.pid||null,c:(()=>{const pr=l.pid&&S.products.find(z=>z.id===l.pid);return pr&&pr.cost>0?pr.cost:0;})()})).filter(l=>l.q>0&&l.p>0);
  const total=lines.reduce((s,l)=>s+l.q*l.p,0);
  if(!lines.length||total<=0){ d.err=t("err_total"); $("#s-err").textContent=d.err; return; }
  const need={}; lines.forEach(l=>{ if(l.pid) need[l.pid]=(need[l.pid]||0)+l.q; });
  for(const pid in need){ const pr=S.products.find(x=>x.id===pid); if(pr&&need[pid]>pr.qty){ d.err=t("err_stock",pr.name,pr.qty); $("#s-err").textContent=d.err; return; } }
  let paid=draftPaid(); if(paid>total) paid=total;
  let custId=d.cust||null;
  if(d.newCust){
    if(!d.nc.name.trim()){ d.err=t("err_name"); $("#s-err").textContent=d.err; return; }
    const c={id:uid(),name:d.nc.name.trim(),phone:d.nc.phone.trim(),created:new Date().toISOString()};
    S.customers.push(c); custId=c.id;
  }
  if(!custId&&total-paid>0.001){ d.err=t("err_cust"); $("#s-err").textContent=d.err; return; }
  const x={id:uid(),no:++S.counter,type:"sale",cust:custId,date:new Date().toISOString(),lines,total,paid,due:(total-paid>0.001&&/^\d{4}-\d{2}-\d{2}$/.test(d.due||""))?d.due:"",note:d.note.trim(),by:me()?me().name:""};
  for(const pid in need){ const pr=S.products.find(y=>y.id===pid); if(pr) pr.qty=Math.round((pr.qty-need[pid])*1000)/1000; }
  S.txs.push(x); save();
  ui.draft=null; ui.modal={type:"receipt",id:x.id}; ui.view="home"; render(); toast(t("created"));
}
function savePayment(id){
  const amt=parseAmt($("#p-amt").value), err=$("#p-err");
  const bal=balanceOf(id);
  if(amt<=0){ err.textContent=t("err_amount"); return; }
  if(amt>bal+0.001){ err.textContent=t("err_over"); return; }
  const m=document.querySelector("#p-method [aria-pressed=true]");
  const x={id:uid(),no:++S.counter,type:"payment",cust:id,date:new Date().toISOString(),amount:amt,method:m?m.dataset.m:"cash",note:$("#p-note").value.trim(),by:me()?me().name:""};
  S.txs.push(x); save(); ui.modal={type:"receipt",id:x.id}; render(); toast(t("pay_saved"));
}
function csvOf(){
  const q=v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`;
  const rows=[["no","date","type","customer","items","total","paid","payment_amount","method","note","cancelled"]];
  [...S.txs].sort((a,b)=>a.no-b.no).forEach(x=>rows.push([x.no,x.date,x.type,custName(x.cust),
    x.type==="sale"?x.lines.map(l=>`${l.q} x ${l.d} @ ${l.p}`).join("; "):"",x.total??"",x.paid??"",x.amount??"",x.method||"",x.note||"",x.void?"yes":""]));
  return "﻿"+rows.map(r=>r.map(q).join(",")).join("\r\n");
}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, id=el.dataset.id;
  if(a==="veil"){ if(e.target===el){ ui.modal=null; renderModal(); } return; }
  switch(a){
    case "tab": ui.view=el.dataset.v; ui.custId=null; if(ui.view!=="sale") {} render(); window.scrollTo(0,0); break;
    case "lang": S.shop.lang=L()==="fr"?"en":"fr"; save(); render(); break;
    case "clear-examples":
      S.customers=S.customers.filter(c=>!c.example); S.txs=S.txs.filter(x=>!x.example); S.products=S.products.filter(p=>!p.example);
      S.counter=S.txs.reduce((m,x)=>Math.max(m,x.no),0); save(); render(); toast(t("examples_gone")); break;
    case "remind": ui.modal={type:"remind",id}; renderModal(); break;
    case "copy-msg": { const c=custById(id); copyText(remindText(c)); break; }
    case "statement": ui.modal={type:"statement",id}; renderModal(); break;
    case "copy-statement": { const c=custById(id); if(c) copyText(statementText(c)); break; }
    case "add-expense": ui.modal={type:"expense"}; renderModal(); break;
    case "save-expense": saveExpense(); break;
    case "stop-rule": if(confirm(t("exp_stop_q"))){ S.expRules=(S.expRules||[]).filter(r=>r.id!==id); save(); render(); } break;
    case "del-expense": if(confirm(t("exp_del_q"))){ S.expenses=(S.expenses||[]).filter(e=>e.id!==id); save(); render(); } break;
    case "open-cust": ui.custId=id; render(); window.scrollTo(0,0); break;
    case "back-cust": ui.custId=null; render(); break;
    case "add-cust": ui.modal={type:"newcust"}; renderModal(); break;
    case "save-cust": {
      const n=$("#c-name").value.trim(); if(!n){ $("#c-err").textContent=t("err_name"); break; }
      S.customers.push({id:uid(),name:n,phone:$("#c-phone").value.trim(),created:new Date().toISOString()});
      save(); ui.modal=null; render(); toast(t("cust_saved")); break; }
    case "del-cust": ui.modal={type:"delcust",id}; renderModal(); break;
    case "del-cust-yes": S.customers=S.customers.filter(c=>c.id!==id); S.txs.forEach(x=>{ if(x.cust===id) x.cust=null; });
      save(); ui.modal=null; ui.custId=null; render(); break;
    case "new-payment": ui.modal={type:"payment",id}; renderModal(); break;
    case "pay-method": document.querySelectorAll("#p-method .pill").forEach(b=>b.setAttribute("aria-pressed",String(b===el))); break;
    case "save-payment": savePayment(id); break;
    case "sale-for": ui.draft=newDraft(id); ui.view="sale"; ui.custId=null; render(); window.scrollTo(0,0); break;
    case "sale-newcust": ui.draft.newCust=true; render(); $("#nc-name")&&$("#nc-name").focus(); break;
    case "sale-existing": ui.draft.newCust=false; render(); break;
    case "add-line": ui.draft.lines.push({d:"",q:"1",p:"",pid:null,auto:false}); render(); { const i=ui.draft.lines.length-1; const f=$("#l"+i+"d"); f&&f.focus(); } break;
    case "del-line": ui.draft.lines.splice(+el.dataset.i,1); render(); break;
    case "mode": ui.draft.mode=el.dataset.m; render(); break;
    case "save-sale": saveSale(); break;
    case "open-receipt": ui.modal={type:"receipt",id}; renderModal(); break;
    case "copy-receipt": { const k=ui.modal&&ui.modal.kind; copyText(receiptText(S.txs.find(x=>x.id===id),k)); break; }
    case "toggle-doc": ui.modal.kind=ui.modal.kind==="invoice"?"receipt":"invoice"; renderModal(); break;
    case "txt-receipt": { const x=S.txs.find(y=>y.id===id); const k=ui.modal&&ui.modal.kind; saveFile(`${k==="invoice"?"facture":"recu"}-${pad4(x.no)}.txt`,receiptText(x,k)); break; }
    case "add-product": ui.modal={type:"product",id:null}; renderModal(); break;
    case "open-product": ui.modal={type:"product",id}; renderModal(); break;
    case "save-product": saveProduct(); break;
    case "del-product": ui.modal={type:"delproduct",id}; renderModal(); break;
    case "del-product-yes": S.products=S.products.filter(p=>p.id!==id); save(); ui.modal=null; render(); break;
    case "add-person": ui.modal={type:"staff"}; renderModal(); break;
    case "save-staff": {
      const n=$("#st-name").value.trim(), pin=$("#st-pin").value.trim(), er=$("#st-err2");
      if(!n){ er.textContent=t("err_sname"); break; } if(!/^\d{4}$/.test(pin)){ er.textContent=t("err_pin"); break; }
      S.staff.push({id:uid(),name:n,role:$("#st-role").value,pin}); save(); ui.modal=null; render(); break; }
    case "del-staff": {
      const st=S.staff.find(x=>x.id===id); if(!st) break;
      const owners=S.staff.filter(x=>x.role==="owner");
      if(S.shop.staffOn&&st.role==="owner"&&owners.length<=1){ $("#st-err").textContent=t("err_last_owner"); break; }
      S.staff=S.staff.filter(x=>x.id!==id); if(ui.me===id) ui.me=null; save(); render(); break; }
    case "lock-on":
      if(!S.staff.some(x=>x.role==="owner")){ $("#st-err").textContent=t("err_need_owner"); break; }
      S.shop.staffOn=true; S.shop.recovery=String(Math.floor(100000+Math.random()*900000)); ui.me=null; save(); render(); break;
    case "lock-off": S.shop.staffOn=false; S.shop.recovery=""; save(); render(); break;
    case "lock": ui.me=null; ui.view="home"; ui.custId=null; render(); break;
    case "unlock": doUnlock(); break;
    case "forgot": ui.lockForgot=true; render(); break;
    case "reset-access": {
      const v=($("#lk-rec")||{}).value; if(v&&S.shop.recovery&&v.trim()===S.shop.recovery){ S.shop.staffOn=false; S.shop.recovery=""; ui.lockForgot=false; save(); render(); }
      else { $("#lk-err").textContent=t("reset_wrong"); } break; }
    case "load-examples": loadExamples(); break;
    case "hint-off": S.shop.hintOff=true; save(); render(); break;
    case "install-off": try{localStorage.setItem("ecrici-install-off","1");}catch(x){} render(); break;
    case "goto": ui.view=el.dataset.to; ui.custId=null; render(); window.scrollTo(0,0); break;
    case "install-app": if(deferredInstall){ const d=deferredInstall; deferredInstall=null; try{ d.prompt(); d.userChoice.then(()=>render(),()=>render()); }catch(x){ render(); } } break;
    case "bc-open": ui.view="bc"; render(); window.scrollTo(0,0); break;
    case "bc-back": ui.view="cust"; render(); break;
    case "bc-tpl": bcState().text=BC_TPL[L()][el.dataset.k]; render(); break;
    case "bc-aud": bcState().aud=el.dataset.k; render(); break;
    case "bc-copy": copyText(bcState().text.replace(/\s*\{name\}/g,"").replace(/\{shop\}/g,S.shop.name)); break;
    case "bc-sent": { const b=bcState(); b.sent[el.dataset.bcid]=1; el.textContent=t("bc_sent");
      const list=bcAudience(b.aud); const pr=$("#bc-progress"); if(pr) pr.textContent=t("bc_progress",list.filter(c=>b.sent[c.id]).length,list.filter(c=>intlPhone(c.phone)).length); break; }
    case "edit-cust": ui.modal={type:"editcust",id}; renderModal(); break;
    case "save-ecust": { const c=custById(id), n=$("#ec-name").value.trim(); if(!n){ $("#ec-err").textContent=t("err_name"); break; }
      c.name=n; c.phone=$("#ec-phone").value.trim(); save(); ui.modal=null; render(); toast(t("saved_ok")); break; }
    case "ask-cancel": ui.modal={type:"cancel",id}; renderModal(); break;
    case "do-cancel": voidTx(id); break;
    case "rep-period": ui.repPeriod=el.dataset.p; ui.repOff=0; render(); break;
    case "rep-prev": ui.repOff--; render(); break;
    case "rep-next": if(ui.repOff<0) ui.repOff++; render(); break;
    case "close-modal": ui.modal=null; renderModal(); break;
    case "save-settings": {
      const s=S.shop, oldC=s.country;
      s.name=$("#s-name").value.trim()||"Ma Boutique"; s.phone=$("#s-phone").value.trim(); s.address=($("#s-addr").value||"").trim();
      s.country=$("#s-country").value; s.lang=$("#s-lang").value; s.footer=$("#s-footer").value.trim();
      s.lateDays=Math.max(1,parseInt($("#s-late").value,10)||14);
      if(oldC!==s.country&&!$("#s-lang").dataset.touched) {}
      save(); render(); toast(t("saved_ok")); break; }
    case "backup-now": backupNow(); break;
    case "theme": setTheme(el.dataset.m); break;
    case "export-csv": saveFile(`ecrici-${todayKey()}.csv`,csvOf()); break;
    case "reset": ui.confirmReset=true; render(); break;
    case "reset-no": ui.confirmReset=false; render(); break;
    case "reset-yes": S=blank(); ui.confirmReset=false; ui.custId=null; ui.view="home"; save(); render(); break;
  }
});
/* sms: links cannot open from inside a framed page (it blanks the page). When framed, copy the message instead. */
document.addEventListener("click",async e=>{
  const a=e.target.closest&&e.target.closest('a[href^="sms:"]'); if(!a) return;
  let framed=false; try{ framed=window.self!==window.top; }catch(_){ framed=true; }
  if(!framed) return;
  e.preventDefault();
  const href=a.getAttribute("href"), q=href.indexOf("?body=");
  const to=href.slice(4,q<0?undefined:q), body=q<0?"":decodeURIComponent(href.slice(q+6));
  await copyText(body);
  toast(L()==="fr"?`Message copié. Ouvrez vos SMS, écrivez à ${to||"votre client"} et collez.`:`Message copied. Open your SMS app, write to ${to||"your customer"} and paste.`);
},true);
document.addEventListener("input",e=>{
  const el=e.target; if(!el.dataset||!el.dataset.bind) return;
  const r=setBind(el.dataset.bind,el.value);
  if(r==="search"||r==="hsearch"){ const pos=el.selectionStart; render(); const n=$("#"+el.id); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(_){} } return; }
  updateSaleTotals();
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.bind==="cust"){ setBind("cust",el.value); }
  if(el.id==="s-country"){ const l=$("#s-lang"); if(l) l.value=COUNTRIES[el.value].lang; }
  if(el.id==="f-import"&&el.files&&el.files[0]){
    const fr=new FileReader();
    fr.onload=()=>{ try{ const p=JSON.parse(fr.result); if(!p||!p.shop||!Array.isArray(p.txs)||!Array.isArray(p.customers)) throw 0;
      S=migrate(p); save(); ui.view="home"; render(); toast(t("imported")); }catch(_){ toast(t("bad_file")); } };
    fr.readAsText(el.files[0]);
  }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&ui.modal){ ui.modal=null; renderModal(); } if(e.key==="Enter"&&e.target.id==="lk-pin") doUnlock(); });

function blank(){ return {v:1,updated:Date.now(),counter:0,shop:{name:"Ma Boutique",phone:"",country:"BJ",lang:"fr",footer:"",lateDays:14,staffOn:false,recovery:""},customers:[],txs:[],products:[],staff:[],expenses:[],expRules:[]}; }

/* ---------- boot ---------- */
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
S=load()||seed();
applyTheme();
if(!load()) save();
render();
initCloud();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
