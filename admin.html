<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Ecrici Admin</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--paper:#f2f4fa;--card:#fff;--ink:#14204a;--muted:#5d6784;--line:#e1e5f0;--accent:#2447d6;--accent-ink:#fff;--soft:#eaf0ff;--bad:#b4321f;--bad-bg:#fbe9e5;--ok:#17714a;--ok-bg:#e2f4ea;--warn-bg:#fff3d1;--warn-ink:#7a5200;--amber:#f2a91b;--sh:0 1px 2px rgba(20,32,74,.06),0 6px 18px rgba(20,32,74,.06)}
@media (prefers-color-scheme:dark){:root{--paper:#0d1226;--card:#161e3a;--ink:#e8ecf8;--muted:#9aa5c6;--line:#27315a;--accent:#7d97ff;--accent-ink:#0c1230;--soft:#1d2850;--bad:#ff9a88;--bad-bg:#3a1c1a;--ok:#6fd9a2;--ok-bg:#14301f;--warn-bg:#3b2f0d;--warn-ink:#f3d78a;--sh:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
header.bar{position:sticky;top:0;z-index:5;background:var(--paper);padding:max(12px,env(safe-area-inset-top)) 16px 0;border-bottom:1px solid var(--line)}
.wrap{max-width:760px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.3px}.brand i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#2f55e0,#1f3fbf);display:grid;place-items:center;color:#fff;font-style:normal;font-size:16px}.brand small{font-weight:600;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 0;padding:0 16px}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;font-size:15px;padding:10px 12px 12px;border-bottom:3px solid transparent;border-radius:0;display:flex;gap:6px;align-items:center;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs .n{background:var(--amber);color:#2b1c00;border-radius:99px;font-size:12px;min-width:20px;padding:1px 6px;text-align:center}
main{max-width:760px;margin:0 auto;padding:14px 16px max(28px,env(safe-area-inset-bottom));display:grid;gap:12px}
h1{font-size:24px;margin:6px 0 0}h2{font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:10px 2px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;box-shadow:var(--sh)}
.card.flat{box-shadow:none;background:transparent}
input,select{font:inherit;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
label{font-size:14px;color:var(--muted);display:grid;gap:4px}
button,a.b{font:inherit;font-weight:650;font-size:14.5px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 13px;cursor:pointer;text-decoration:none;text-align:center;display:inline-block;min-height:40px}
button.p,a.b.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}button.d{color:var(--bad)}button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 auto}
.err{color:var(--bad);font-size:14px;min-height:0}.err:empty{display:none}
.ok{background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:10px 12px;font-size:14.5px;font-weight:600}.ok a{color:inherit}
.chip{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pending{background:var(--warn-bg);color:var(--warn-ink)}.active{background:var(--ok-bg);color:var(--ok)}.suspended,.expired{background:var(--bad-bg);color:var(--bad)}.neutral{background:var(--soft);color:var(--accent)}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}@media(max-width:480px){.kpi{grid-template-columns:repeat(2,1fr)}}
.kpi button{padding:12px 6px;display:grid;gap:2px;text-align:center;border-radius:14px;box-shadow:var(--sh)}.kpi b{font-size:24px;letter-spacing:-1px;line-height:1.1}.kpi span{font-size:12px;color:var(--muted);font-weight:600}
.name{font-weight:750;font-size:16.5px;overflow-wrap:anywhere}.muted{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.item{display:flex;gap:12px;align-items:flex-start}.av{flex:none;width:42px;height:42px;border-radius:12px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:17px}
.grow{flex:1;min-width:0}
.sec{display:flex;justify-content:space-between;align-items:center;gap:8px}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}.empty b{display:block;font-size:30px;color:var(--ok)}
.bar2{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}.bar2 i{display:block;height:100%;background:var(--accent)}
.star{color:var(--amber);letter-spacing:2px;white-space:nowrap}
details>summary{cursor:pointer;font-weight:650;color:var(--muted);font-size:14px;list-style:none}details>summary::-webkit-details-marker{display:none}details>summary:after{content:" ▾"}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script>
(function(){
"use strict";
const CFG=window.ECRICI||{}, BASE=String(CFG.url||"").replace(/\/+$/,""), SK="ecrici-admin-session";
const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
const lsDel=k=>{try{localStorage.removeItem(k);}catch(e){}};
let sess=null; try{ sess=JSON.parse(lsGet(SK)); }catch(e){}
let shops=[], claims=[], branches=[], reps=[], pages=[], rvs=[], rvrep={}, promos={}, pmOpen="", pmItems=[], pmSel=[], pmNoSql=false, q="", pq="", filter="all", rf="reported", tab=lsGet("ecrici-admin-tab")||"today", err="", msg="", msgLink="", lastEmail="";

async function http(path,o){
  o=o||{};
  const h={apikey:CFG.key,"Content-Type":"application/json"}; if(o.token) h.Authorization="Bearer "+o.token; Object.assign(h,o.headers||{});
  let r; try{ r=await fetch(BASE+path,{method:o.method||"GET",headers:h,body:o.body?JSON.stringify(o.body):undefined,cache:"no-store"}); }
  catch(e){ return {ok:false,status:0,json:null}; }
  let j=null; try{ j=await r.json(); }catch(e){}
  return {ok:r.ok,status:r.status,json:j};
}
async function api(path,o){
  if(!sess) return {ok:false,status:401};
  if(sess.exp-Date.now()<60000){
    const r=await http("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:{refresh_token:sess.refresh}});
    if(r.ok){ sess={access:r.json.access_token,refresh:r.json.refresh_token,exp:Date.now()+(r.json.expires_in||3600)*1000}; lsSet(SK,JSON.stringify(sess)); }
    else if(r.status>=400&&r.status<500){ sess=null; lsDel(SK); return {ok:false,status:401}; }
  }
  return http(path,Object.assign({},o,{token:sess.access}));
}
const PRICES={BJ:["FCFA",1000,700],TG:["FCFA",1000,700],CI:["FCFA",1000,700],SN:["FCFA",1000,700],BF:["FCFA",1000,700],ML:["FCFA",1000,700],NE:["FCFA",1000,700],CM:["FCFA",1000,700],
  NG:["\u20a6",2500,2000,1],GH:["GH\u20b5",20,15,1],KE:["KSh",250,150,1],ZA:["R",30,20,1],RW:["RWF",2500,1500],TZ:["TZS",4500,3000],UG:["UGX",6500,4500]};
const P=cc=>{const o=(CFG.prices&&CFG.prices[cc])||{},d=PRICES[cc]||PRICES.BJ;return{cur:o.cur||d[0],base:Number(o.base)||d[1],extra:Number(o.extra)||d[2],pre:o.pre!=null?!!o.pre:!!d[3]};};
const brOf=id=>branches.filter(b=>b.owner_id===id);
const fmtAmt=(n,cc)=>{const p=P(cc),s=String(n).replace(/\B(?=(\d{3})+(?!\d))/g,",");return p.pre?p.cur+s:s+" "+p.cur;};
const rew=cc=>Math.round(P(cc).base*0.6);
const state=s=>{ if(s.status==="pending") return "pending"; if(s.status==="suspended") return "suspended"; return (s.paid_until&&s.paid_until>=today())?"active":"expired"; };
const daysLeft=s=>s.paid_until?Math.round((new Date(s.paid_until+"T12:00:00Z")-new Date(today()+"T12:00:00Z"))/864e5):null;


const BIZN={shop:"Shop / general trade",electronics:"Electronics",pharmacy:"Pharmacy",food:"Restaurant / food",beauty:"Salon / beauty",health:"Clinic / lab",school:"School / training",repair:"Artisans & repairs",travel:"Travel & tours",services:"Other services",rent:"Rentals",hotel:"Hotel / guesthouse"};
const bizOf=s=>BIZN[s.biz]||"Not chosen yet";
const ini=s=>String(s||"?").trim().charAt(0).toUpperCase()||"?";
const undoAll=()=>{ try{ return JSON.parse(lsGet("ecrici-adm-undo")||"{}"); }catch(e){ return {}; } };
const undoGet=id=>undoAll()[id]||null;
const undoSet=(id,v)=>{ const o=undoAll(); o[id]=v; const k=Object.keys(o); if(k.length>60) delete o[k[0]]; lsSet("ecrici-adm-undo",JSON.stringify(o)); };
const undoDel=id=>{ const o=undoAll(); delete o[id]; lsSet("ecrici-adm-undo",JSON.stringify(o)); };
const FRC=["BJ","TG","CI","SN","BF","ML","NE","CM"];
const wDone=()=>{ try{ return JSON.parse(lsGet("ecrici-welcomed")||"{}"); }catch(e){ return {}; } };
const wMark=id=>{ const o=wDone(); o[id]=1; lsSet("ecrici-welcomed",JSON.stringify(o)); };
function welcomeLink(s){
  if(!s||!s.phone) return "";
  const fr=FRC.includes(String(s.country||"").toUpperCase()), nm=(s.name||"").trim()||(fr?"":"there");
  let dt=""; if(s.paid_until){ const p=String(s.paid_until).slice(0,10).split("-"); dt=fr?p[2]+"/"+p[1]+"/"+p[0]:new Date(s.paid_until+"T00:00:00Z").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"}); }
  const t=fr?"Bonjour "+nm+" 👋\n\nBienvenue sur Ecrici ! ✅ Votre compte a été approuvé avec succès"+(dt?" et reste actif jusqu'au "+dt:"")+".\n\nPour bien démarrer :\n1. Ouvrez ecrici.com et connectez-vous\n2. Ajoutez vos produits ou services\n3. Dans Réglages › Ma page en ligne, créez votre page pour que vos clients vous trouvent\n\nUne question ? Répondez simplement à ce message, je vous aide.\n— L'équipe Ecrici"
   :"Hello "+nm+" 👋\n\nWelcome to Ecrici! ✅ Your account has been approved successfully"+(dt?" and is active until "+dt:"")+".\n\nTo get started:\n1. Open ecrici.com and log in\n2. Add your products or services\n3. In Settings › My online page, create your page so customers can find you\n\nAny question? Just reply to this message and I will help.\n— The Ecrici team";
  return "https://wa.me/"+String(s.phone).replace(/\D/g,"")+"?text="+encodeURIComponent(t);
}
const waOf=p=>p?"https://wa.me/"+String(p).replace(/\D/g,""):"";
const stars=n=>"★".repeat(n)+"☆".repeat(5-n);
const dshort=d=>{ try{ return new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}); }catch(e){ return ""; } };
function frame(inner){
  const t=todoCounts();
  const T=[["today","Today",t.total],["shops","Shops",0],["pages","Pages",t.pg],["reviews","Reviews",t.rv],["stats","Stats",0]];
  app.innerHTML=`<header class="bar"><div class="wrap"><div class="top"><div class="brand"><i>E</i><span>Ecrici <small>Admin</small></span></div><button id="out">Log out</button></div>
    <nav class="tabs" role="tablist">${T.map(([k,l,n])=>`<button role="tab" aria-selected="${tab===k}" data-tab="${k}">${l}${n?`<span class="n">${n}</span>`:""}</button>`).join("")}</nav></div></header>
    <main>${err?`<div class="err" id="er" style="background:var(--bad-bg);padding:10px 12px;border-radius:12px">${esc(err)}</div>`:""}${msg?`<div class="ok">${esc(msg)}${msgLink?` · <a href="${esc(msgLink)}" target="_blank" rel="noopener">Send on WhatsApp</a>`:""}</div>`:""}${inner}</main>`;
}
function todoCounts(){
  const pend=shops.filter(s=>state(s)==="pending").length, br=branches.filter(b=>b.status==="pending").length, mk=shops.filter(s=>s.market_ok===false&&s.market_asked).length, rw=shops.filter(s=>s.ref_status==="due").length;
  const gp=Object.keys(repsBy()).length, rrep=rvFlag().length;
  return {pend,br,mk,rw,claims:claims.length,pg:gp,rv:rrep,total:pend+br+mk+rw+claims.length+gp+rrep};
}
const repsBy=()=>{ const g={}; reps.forEach(r=>{ (g[r.slug]=g[r.slug]||{slug:r.slug,n:0,why:{}}).n++; g[r.slug].why[r.reason]=(g[r.slug].why[r.reason]||0)+1; }); return g; };
const rvFlag=()=>rvs.filter(r=>(rvrep[r.id]||0)>0||r.hidden);
function draw(){ draw0(); const sg=err+"|"+msg; if((err||msg)&&sg!==window.__sg) window.scrollTo(0,0); window.__sg=sg; }
function draw0(){
  const v={today:vToday,shops:vShops,pages:vPages,reviews:vReviews,stats:vStats}[tab]||vToday;
  frame(v());
  const keep=document.activeElement&&document.activeElement.id;
  $("#out").onclick=()=>{ sess=null; lsDel(SK); err=""; login(); };
  const qi=$("#q"); if(qi) qi.oninput=e=>{ q=e.target.value; const pos=e.target.selectionStart; draw(); const n=$("#q"); n.focus(); n.setSelectionRange(pos,pos); };
  const pi=$("#pq"); if(pi) pi.oninput=e=>{ pq=e.target.value; const pos=e.target.selectionStart; draw(); const n=$("#pq"); n.focus(); n.setSelectionRange(pos,pos); };
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button,a"); if(!b||!app.contains(b)) return; const d=b.dataset;
  if(d.w){ wMark(d.w); setTimeout(draw,400); return; }
  if(d.tab){ tab=d.tab; lsSet("ecrici-admin-tab",tab); err=""; msg=""; draw(); window.scrollTo(0,0); }
  else if(d.go){ tab=d.go; if(d.f) filter=d.f; if(d.rf) rf=d.rf; lsSet("ecrici-admin-tab",tab); err=""; msg=""; draw(); window.scrollTo(0,0); }
  else if(d.f!==undefined&&!d.go){ filter=d.f; draw(); }
  else if(d.rf){ rf=d.rf; draw(); }
  else if(d.a) act(d.id,d.a,d.cid);
  else if(d.ba) bact(d.bid,d.ba);
  else if(d.pg) pgAct(d.slug,d.pg);
  else if(d.vf) vfAct(d.slug,d.vf==="on");
  else if(d.rv) rvAct(d.id,d.rv);
  else if(d.pm) pmAct(d.slug,d.pm,d.days);
  else if(d.pmi!==undefined) pmTog(d.pmi);
});
/* ---- TODAY ---- */
function vToday(){
  const t=todoCounts(), out=[];
  if(claims.length) out.push(`<h2>Payments to check (${claims.length})</h2>`+claims.map(c=>{ const s=shops.find(x=>x.id===c.shop_id)||{}; const amt=fmtAmt(P(s.country).base*c.months,s.country);
    return `<div class="card"><div class="item"><div class="av">₣</div><div class="grow"><div class="name">${esc(s.name||s.phone||"Unknown")}</div><div class="muted">${c.months} month${c.months>1?"s":""} · ${esc(amt)} · ref: ${esc(c.ref||"none")}</div></div></div><div class="muted">Check the money arrived, then confirm.</div><div class="row"><button class="p" data-id="${esc(c.shop_id)}" data-cid="${esc(c.id)}" data-a="claim-ok">Confirm</button><button data-id="${esc(c.shop_id)}" data-cid="${esc(c.id)}" data-a="claim-no">Reject</button></div></div>`; }).join(""));
  const pend=shops.filter(s=>state(s)==="pending"); if(pend.length) out.push(`<h2>New shops waiting (${pend.length})</h2>`+pend.map(s=>shopCard(s)).join(""));
  const mk=shops.filter(s=>s.market_ok===false&&s.market_asked); if(mk.length) out.push(`<h2>Public page requests (${mk.length})</h2>`+mk.map(s=>`<div class="card"><div class="item"><div class="av">${esc(ini(s.name))}</div><div class="grow"><div class="name">${esc(s.name||s.phone)}</div><div class="muted">${esc(bizOf(s))} · wants a public page</div></div></div><div class="row"><button class="p" data-id="${esc(s.id)}" data-a="mkt-on">Allow public page</button>${s.phone?`<a class="b" href="${esc(waOf(s.phone))}" target="_blank" rel="noopener">WhatsApp</a>`:""}</div></div>`).join(""));
  const br=branches.filter(b=>b.status==="pending"); if(br.length) out.push(`<h2>Extra shop requests (${br.length})</h2>`+br.map(b=>{ const o=shops.find(x=>x.id===b.owner_id)||{}; return `<div class="card"><div class="item"><div class="av">${esc(ini(b.name))}</div><div class="grow"><div class="name">${esc(b.name)}</div><div class="muted">Owner: ${esc(o.name||o.phone||"")}</div></div></div><div class="row"><button class="p" data-bid="${esc(b.id)}" data-ba="on">Activate (+${esc(fmtAmt(P(o.country).extra,o.country))})</button></div></div>`; }).join(""));
  const due=shops.filter(s=>s.ref_status==="due"); if(due.length) out.push(`<h2>Rewards to pay (${due.length})</h2>`+due.map(s=>`<div class="card"><div class="item"><div class="av">★</div><div class="grow"><div class="name">${esc(s.referred_by)} · ${esc(fmtAmt(rew(s.country),s.country))}</div><div class="muted">for ${esc(s.name||s.phone)}</div></div><button class="p" data-id="${esc(s.id)}" data-a="refpaid">Mark paid</button></div></div>`).join(""));
  if(t.pg) out.push(`<div class="card"><div class="sec"><div><div class="name">⚠ ${t.pg} reported page${t.pg>1?"s":""}</div><div class="muted">Check them and keep or turn off.</div></div><button class="p" data-go="pages">Open</button></div></div>`);
  if(t.rv) out.push(`<div class="card"><div class="sec"><div><div class="name">⚠ ${t.rv} review${t.rv>1?"s":""} reported or hidden</div><div class="muted">Keep the honest ones, delete the rest.</div></div><button class="p" data-go="reviews">Open</button></div></div>`);
  const cnt={pending:0,active:0,expired:0,suspended:0}; shops.forEach(s=>cnt[state(s)]++);
  const kp=`<div class="kpi">${["active","pending","expired","suspended"].map(k=>`<button data-go="shops" data-f="${k}"><b>${cnt[k]}</b><span>${k}</span></button>`).join("")}</div>`;
  return kp+(out.length?out.join(""):`<div class="card"><div class="empty"><b>✓</b>All clear. Nothing needs you right now.</div></div>`);
}
/* ---- SHOPS ---- */
function refLine(s){
  if(!s.referred_by) return "";
  const amt=fmtAmt(rew(s.country),s.country);
  const st=s.ref_status==="paid"?`Reward paid (${esc(amt)})`:s.ref_status==="due"?`<b>Reward to pay: ${esc(amt)}</b>`:"Reward starts after first payment";
  return `<div class="muted">Referred by <b>${esc(s.referred_by)}</b> · ${st}</div>`;
}
function shopsBlock(s){
  const bs=brOf(s.id), n=1+bs.filter(b=>b.status==="active").length; if(!bs.length) return "";
  return `<div class="muted"><b>${n} shop${n>1?"s":""}</b> · ${esc(fmtAmt(P(s.country).base+P(s.country).extra*(n-1),s.country))} / month</div>`+bs.map(b=>`<div class="card flat" style="padding:10px;gap:8px;border-style:dashed"><div class="sec"><div class="name" style="font-size:15px">${esc(b.name)}</div><span class="chip ${b.status==="active"?"active":b.status==="pending"?"pending":"suspended"}">${esc(b.status)}</span></div>
    <div class="row">${b.status==="pending"?`<button class="p" data-bid="${esc(b.id)}" data-ba="on">Activate (+${esc(fmtAmt(P(s.country).extra,s.country))})</button>`:""}${b.status==="suspended"?`<button data-bid="${esc(b.id)}" data-ba="on">Reactivate</button>`:""}${b.status==="active"?`<button class="d" data-bid="${esc(b.id)}" data-ba="off">Suspend</button>`:""}${b.status!=="active"?`<button class="d" data-bid="${esc(b.id)}" data-ba="del">Delete</button>`:""}</div></div>`).join("");
}
function shopCard(s){
  const st=state(s), dl=daysLeft(s), wa=waOf(s.phone);
  const info=s.paid_until?`Paid until ${s.paid_until}${dl!=null?` (${dl>=0?dl+" days left":Math.abs(dl)+" days ago"})`:""}`:"Not paid yet";
  return `<div class="card" data-shop="${esc(s.id)}"><div class="item"><div class="av">${esc(ini(s.name))}</div><div class="grow"><div class="name">${esc(s.name||"(no name)")}</div><div class="muted">+${esc(s.phone)} · ${esc(s.country)} · ${esc(bizOf(s))}</div></div><span class="chip ${st}">${st}</span></div>
    <div class="muted">${esc(info)}</div>${s.market_ok===false?`<div class="muted"><b>Public page: ${s.market_asked?"WAITING for you":"not allowed yet"}</b></div>`:""}${refLine(s)}${shopsBlock(s)}

    if(t.trim()!=="DELETE"){ err="Not deleted."; draw(); return; }
    const r=await api("/rest/v1/rpc/admin_delete_branch",{method:"POST",body:{target:id}});
    if(!r.ok){ err=r.status===401?"Session ended. Log in again.":((r.json&&r.json.message)||"Not deleted")+(r.status===404?" (run upgrade-multishop.sql in Supabase first)":""); draw(); return; }
    branches=branches.filter(x=>x.id!==id); msg="Deleted shop: "+b.name; draw(); return;
  }
  if(a==="off"&&!confirm("Suspend "+b.name+"?")) return;
  const r=await api("/rest/v1/branches?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{Prefer:"return=representation"},body:{status:a==="on"?"active":"suspended"}});
  if(!r.ok||!Array.isArray(r.json)||!r.json.length){ err=r.status===401?"Session ended. Log in again.":"Not saved."; draw(); return; }
  Object.assign(b,r.json[0]);
  const o=shops.find(x=>x.id===b.owner_id), n=1+brOf(b.owner_id).filter(x=>x.status==="active").length;
  msg="Saved: "+b.name+" is "+b.status+". Owner now pays "+fmtAmt(P(o?o.country:"").base+P(o?o.country:"").extra*(n-1),o?o.country:"")+" / month. ";
  if(a==="on"&&o&&o.phone){ msgLink="https://wa.me/"+String(o.phone).replace(/\D/g,"")+"?text="+encodeURIComponent("Hello, your shop "+b.name+" is now active on Ecrici."); }
  draw();
}
function addTo(base,a){
  const d=new Date(base+"T12:00:00Z");
  if(a==="trial") d.setUTCDate(d.getUTCDate()+30); else d.setUTCMonth(d.getUTCMonth()+({m1:1,m3:3,m12:12}[a]));
  return d.toISOString().slice(0,10);
}
async function act(id,a,cid){
  const s=shops.find(x=>x.id===id); if(!s) return;
  if(a==="claim-ok"||a==="claim-no"){
    const c=claims.find(x=>x.id===cid); if(!c) return;
    err=""; msg=""; msgLink="";
    if(a==="claim-ok"){ await act(id,"m"+c.months); if(err) return; }
    const r=await api("/rest/v1/pay_claims?id=eq."+encodeURIComponent(cid),{method:"PATCH",headers:{Prefer:"return=representation"},body:{status:a==="claim-ok"?"confirmed":"rejected",decided_at:new Date().toISOString()}});
    if(!r.ok){ err=(r.status===404?"Run upgrade-payments.sql in Supabase first. ":"")+"Claim not updated."; draw(); return; }
    claims=claims.filter(x=>x.id!==cid);
    msg=(a==="claim-ok"?"Confirmed and activated: ":"Rejected: ")+(s.name||s.phone);
    if(s.phone){ msgLink="https://wa.me/"+String(s.phone).replace(/\D/g,"")+"?text="+encodeURIComponent(a==="claim-ok"?"Hello, we received your payment. Your Ecrici subscription is active. Thank you!":"Hello, we could not find your Ecrici payment yet. Please send us the receipt on WhatsApp."); }
    draw(); return;
  }
  if(a==="pw"){
    const L="ABCDEFGHJKLMNPQRSTUVWXYZ",pk=n=>Array.from({length:n},()=>L[Math.floor(Math.random()*L.length)]).join(""), def=pk(3)+String(Math.floor(1000+Math.random()*9000))+pk(1);
    const np=prompt("New password for "+(s.name||s.phone)+" (8 characters or more). Send it to the shop afterwards:",def);
    if(np===null) return;
    err=""; msg=""; msgLink="";
    if(np.length<8){ err="Password must be at least 8 characters."; draw(); return; }
    const r=await api("/rest/v1/rpc/admin_set_password",{method:"POST",body:{target:id,new_password:np}});
    if(!r.ok){ err=r.status===401?"Session ended. Log in again.":((r.json&&r.json.message)||"Not saved")+(r.status===404?" (run upgrade-password-reset.sql in Supabase first)":""); draw(); return; }
    msg="Password changed for "+(s.name||s.phone)+". New password: "+np+" ";
    msgLink=s.phone?"https://wa.me/"+String(s.phone).replace(/\D/g,"")+"?text="+encodeURIComponent("Hello, your new Ecrici password is: "+np+". You can change it in Settings, Account."):"";
    draw(); return;
  }
  if(a==="del"){
    const code=String(s.phone||"").slice(-4);
    const t=prompt("DELETE FOREVER: "+(s.name||s.phone)+"\nAll their data will be lost and this cannot be undone.\nType the last 4 digits of their number ("+code+") to confirm:");
    if(t===null) return;
    err=""; msg=""; msgLink="";
    if(t.trim()!==code){ err="Not deleted: the digits did not match."; draw(); return; }
    const r=await api("/rest/v1/rpc/admin_delete_shop",{method:"POST",body:{target:id}});
    if(!r.ok){ err=r.status===401?"Session ended. Log in again.":((r.json&&r.json.message)||"Not deleted")+(r.status===404?" (run upgrade-delete-shop.sql in Supabase first)":""); draw(); return; }
    shops=shops.filter(x=>x.id!==id); msg="Deleted: "+(s.name||s.phone); draw(); return;
  }
  let body, isUndo=false;
  if(a==="undo"){ const sn=undoGet(id); if(!sn){ err="Nothing to undo for this shop."; draw(); return; }
    const parts=Object.keys(sn).map(k=>k+": "+(sn[k]==null?"empty":sn[k])).join(", ");
    if(!confirm("Undo the last change for "+(s.name||s.phone)+"?\nIt goes back to: "+parts)) return; body=Object.assign({},sn); isUndo=true; }
  else if(a==="setdate"){ const inp=document.querySelector('input[data-sd="'+id+'"]'), v=inp?inp.value:"";
    if(!/^\d{4}-\d{2}-\d{2}$/.test(v)){ err="Choose a date first."; draw(); return; }
    if(!confirm("Set "+(s.name||s.phone)+" to active until "+v+"?")) return; body={status:"active",paid_until:v}; }
  else if(a==="susp"){ if(!confirm("Suspend "+(s.name||s.phone)+"?")) return; body={status:"suspended"}; }
  else if(a==="react"){ body={status:"active"}; }
  else if(a==="refpaid"){ body={ref_status:"paid"}; }
  else if(a==="mkt-on"){ body={market_ok:true}; }
  else if(a==="mkt-off"){ if(!confirm("Stop the public page and Market listing for "+(s.name||s.phone)+"?")) return; body={market_ok:false}; }
  else { const base=(s.status==="active"&&s.paid_until&&s.paid_until>today())?s.paid_until:today(); body={status:"active",paid_until:addTo(base,a)}; if(s.referred_by&&!s.ref_status&&a!=="trial") body.ref_status="due"; }
  const wasPending=state(s)==="pending"; const prevVals={}; Object.keys(body).forEach(k=>{ prevVals[k]=(s[k]===undefined?null:s[k]); }); err=""; msg=""; msgLink="";
  const r=await api("/rest/v1/shops?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{Prefer:"return=representation"},body});
  if(!r.ok||!Array.isArray(r.json)||!r.json.length){ err=r.status===401?"Session ended. Log in again.":"Not saved. This account may not be an admin (see the guide)."; draw(); return; }
  Object.assign(s,r.json[0]); if(isUndo) undoDel(id); else undoSet(id,prevVals); msg=(isUndo?"Restored: ":"Saved: ")+(s.name||s.phone); if(wasPending&&s.status==="active"&&s.phone){ msgLink=welcomeLink(s); wMark(s.id); } draw();
}
if(!CFG.url||/PASTE/.test(CFG.url+CFG.key)){ app.innerHTML=`<main><h1>Ecrici Admin</h1><div class="card"><p>config.js is not filled in yet.</p></div></main>`; }
else if(sess) load(); else login();
})();
</script>
