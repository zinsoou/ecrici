<!doctype html>
<html lang="en">

<title>Ecrici Admin</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>

@media (prefers-color-scheme:dark){:root{--paper:#0d1226;--card:#161e3a;--ink:#e8ecf8;--muted:#9aa5c6;--line:#27315a;--accent:#7d97ff;--accent-ink:#0c1230;--soft:#1d2850;--bad:#ff9a88;--bad-bg:#3a1c1a;--ok:#6fd9a2;--ok-bg:#14301f;--warn-bg:#3b2f0d;--warn-ink:#f3d78a;--sh:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}

.tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs .n{background:var(--amber);color:#2b1c00;border-radius:99px;font-size:12px;min-width:20px;padding:1px 6px;text-align:center}
main{max-width:760px;margin:0 auto;padding:14px 16px max(28px,env(safe-area-inset-bottom));display:grid;gap:12px}
h1{font-size:24px;margin:6px 0 0}h2{font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:10px 2px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;box-shadow:var(--sh)}
.card.flat{box-shadow:none;background:transparent}
input,select{font:inherit;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
label{font-size:14px;color:var(--muted);display:grid;gap:4px}
button,a.b{font:inherit;font-weight:650;font-size:14.5px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 13px;cursor:pointer;text-decoration:none;text-align:center;display:inline-block;min-height:40px}
button.p,a.b.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}button.d{color:var(--bad)}button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 auto}
.err{color:var(--bad);font-size:14px;min-height:0}.err:empty{display:none}
.ok{background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:10px 12px;font-size:14.5px;font-weight:600}.ok a{color:inherit}
.chip{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pending{background:var(--warn-bg);color:var(--warn-ink)}.active{background:var(--ok-bg);color:var(--ok)}.suspended,.expired{background:var(--bad-bg);color:var(--bad)}.neutral{background:var(--soft);color:var(--accent)}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}@media(max-width:480px){.kpi{grid-template-columns:repeat(2,1fr)}}
.kpi button{padding:12px 6px;display:grid;gap:2px;text-align:center;border-radius:14px;box-shadow:var(--sh)}.kpi b{font-size:24px;letter-spacing:-1px;line-height:1.1}.kpi span{font-size:12px;color:var(--muted);font-weight:600}
.name{font-weight:750;font-size:16.5px;overflow-wrap:anywhere}.muted{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.item{display:flex;gap:12px;align-items:flex-start}.av{flex:none;width:42px;height:42px;border-radius:12px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:17px}
.grow{flex:1;min-width:0}
.sec{display:flex;justify-content:space-between;align-items:center;gap:8px}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}.empty b{display:block;font-size:30px;color:var(--ok)}
.bar2{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}.bar2 i{display:block;height:100%;background:var(--accent)}
.star{color:var(--amber);letter-spacing:2px;white-space:nowrap}
details>summary{cursor:pointer;font-weight:650;color:var(--muted);font-size:14px;list-style:none}details>summary::-webkit-details-marker{display:none}details>summary:after{content:" ▾"}
[hidden]{display:none!important}
</style>
</head>

<script>
(function(){
"use strict";
const CFG=window.ECRICI||{}, BASE=String(CFG.url||"").replace(/\/+$/,""), SK="ecrici-admin-session";
const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};

let sess=null; try{ sess=JSON.parse(lsGet(SK)); }catch(e){}
let pgq={}, pgqOk=false, actv={}, actOk=false, ann=[], annNoSql=false, annF={fr:"",en:"",link:"",until:""}, shops=[], claims=[], branches=[], reps=[], pages=[], rvs=[], rvrep={}, promos={}, pmOpen="", pmItems=[], pmSel=[], pmNoSql=false, q="", pq="", filter="all", rf="reported", tab=lsGet("ecrici-admin-tab")||"today", err="", msg="", msgLink="", lastEmail="";

async function http(path,o){
  o=o||{};
  const h={apikey:CFG.key,"Content-Type":"application/json"}; if(o.token) h.Authorization="Bearer "+o.token; Object.assign(h,o.headers||{});
  let r; try{ r=await fetch(BASE+path,{method:o.method||"GET",headers:h,body:o.body?JSON.stringify(o.body):undefined,cache:"no-store"}); }
  catch(e){ return {ok:false,status:0,json:null}; }
  let j=null; try{ j=await r.json(); }catch(e){}
  return {ok:r.ok,status:r.status,json:j};
}
async function api(path,o){
  if(!sess) return {ok:false,status:401};
  if(sess.exp-Date.now()<60000){
    const r=await http("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:{refresh_token:sess.refresh}});
    if(r.ok){ sess={access:r.json.access_token,refresh:r.json.refresh_token,exp:Date.now()+(r.json.expires_in||3600)*1000}; lsSet(SK,JSON.stringify(sess)); }
    else if(r.status>=400&&r.status<500){ sess=null; lsDel(SK); return {ok:false,status:401}; }
  }
  return http(path,Object.assign({},o,{token:sess.access}));
}
const PRICES={BJ:["FCFA",1000,700],TG:["FCFA",1000,700],CI:["FCFA",1000,700],SN:["FCFA",1000,700],BF:["FCFA",1000,700],ML:["FCFA",1000,700],NE:["FCFA",1000,700],CM:["FCFA",1000,700],

const P=cc=>{const o=(CFG.prices&&CFG.prices[cc])||{},d=PRICES[cc]||PRICES.BJ;return{cur:o.cur||d[0],base:Number(o.base)||d[1],extra:Number(o.extra)||d[2],pre:o.pre!=null?!!o.pre:!!d[3]};};
const brOf=id=>branches.filter(b=>b.owner_id===id);
const fmtAmt=(n,cc)=>{const p=P(cc),s=String(n).replace(/\B(?=(\d{3})+(?!\d))/g,",");return p.pre?p.cur+s:s+" "+p.cur;};

const state=s=>{ if(s.status==="pending") return "pending"; if(s.status==="suspended") return "suspended"; return (s.paid_until&&s.paid_until>=today())?"active":"expired"; };
const daysLeft=s=>s.paid_until?Math.round((new Date(s.paid_until+"T12:00:00Z")-new Date(today()+"T12:00:00Z"))/864e5):null;

const bizOf=s=>BIZN[s.biz]||"Not chosen yet";
const BIZF={shop:"Boutique / commerce",electronics:"Électronique",pharmacy:"Pharmacie",food:"Restaurant / alimentation",beauty:"Salon / beauté",health:"Clinique / laboratoire",school:"École / formation",repair:"Artisans et réparations",travel:"Voyages et tourisme",services:"Autres services",rent:"Locations",hotel:"Hôtel / auberge"};
const ini=s=>String(s||"?").trim().charAt(0).toUpperCase()||"?";
const undoAll=()=>{ try{ return JSON.parse(lsGet("ecrici-adm-undo")||"{}"); }catch(e){ return {}; } };
const undoGet=id=>undoAll()[id]||null;
const undoSet=(id,v)=>{ const o=undoAll(); o[id]=v; const k=Object.keys(o); if(k.length>60) delete o[k[0]]; lsSet("ecrici-adm-undo",JSON.stringify(o)); };
const undoDel=id=>{ const o=undoAll(); delete o[id]; lsSet("ecrici-adm-undo",JSON.stringify(o)); };
const FRC=["BJ","TG","CI","SN","BF","ML","NE","CM"];
const wDone=()=>{ try{ return JSON.parse(lsGet("ecrici-welcomed")||"{}"); }catch(e){ return {}; } };
const wMark=id=>{ const o=wDone(); o[id]=1; lsSet("ecrici-welcomed",JSON.stringify(o)); };
function welcomeLink(s){
  if(!s||!s.phone) return "";
  const fr=FRC.includes(String(s.country||"").toUpperCase()), nm=(s.name||"").trim()||(fr?"":"there");
  let dt=""; if(s.paid_until){ const p=String(s.paid_until).slice(0,10).split("-"); dt=fr?p[2]+"/"+p[1]+"/"+p[0]:new Date(s.paid_until+"T00:00:00Z").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"}); }
  const bf=BIZF[s.biz], be=BIZN[s.biz];
  const t=fr?
    "Bonjour "+nm+" 👋\n\nBienvenue sur Ecrici ! ✅ Votre compte est approuvé"+(dt?" et actif jusqu'au "+dt:"")+".\n\nOuvrez ecrici.com et connectez-vous : une visite d'1 minute vous montre tout, puis ajoutez votre premier produit ou service."
    +(bf?"\n\n*Votre activité*\nEnregistrée : "+bf+". Ce n'est pas la bonne ? Répondez ici avec votre activité, ou changez-la dans Réglages › Type d'activité.":"")
    +"\n\nUne question ? Répondez simplement à ce message.\n— L'équipe Ecrici"
   :"Hello "+nm+" 👋\n\nWelcome to Ecrici! ✅ Your account is approved"+(dt?" and active until "+dt:"")+".\n\nOpen ecrici.com and log in: a 1-minute tour shows you everything, then add your first product or service."
    +(be?"\n\n*Your business type*\nSet to: "+be+". Not right? Reply here with what you do, or change it in Settings › Type of business.":"")
    +"\n\nAny question? Just reply to this message.\n— The Ecrici team";
  return "https://wa.me/"+String(s.phone).replace(/\D/g,"")+"?text="+encodeURIComponent(t);
}
function pageLink(s){
  if(!s||!s.phone) return "";
  const pg=pages.find(p=>p.shop_id===s.id); if(!pg||!pg.slug) return "";
  const fr=FRC.includes(String(s.country||"").toUpperCase()), nm=(s.name||"").trim()||(fr?"":"there"), u=location.origin+"/s/"+encodeURIComponent(pg.slug);
  const t=fr?
    "Bonjour "+nm+" 👋\n\nBonne nouvelle : votre boutique est maintenant dans le Market Ecrici ✅\n"+u+"\n\nPartagez ce lien sur votre statut WhatsApp, Facebook et Instagram. 📲\n\n*Badge Vérifié ✔ (facultatif)*\nQuand votre page est prête, demandez le badge dans Réglages › Ma page en ligne › « Demander le badge Vérifié ». Nous vérifions votre activité avant de l'accorder : cela peut prendre jusqu'à 24 h. Les pages vérifiées sont mises en avant sur le Market.\n\nUne question ? Répondez simplement à ce message.\n— L'équipe Ecrici"
   :"Hello "+nm+" 👋\n\nGood news: your shop is now listed in the Ecrici Market ✅\n"+u+"\n\nShare this link on your WhatsApp status, Facebook and Instagram. 📲\n\n*Verified badge ✔ (optional)*\nWhen your page is ready, request the badge in Settings › My online page › \"Ask for the Verified badge\". We check your business before granting it, and this can take up to 24 hours. Verified pages are shown first on the Market.\n\nAny question? Just reply to this message.\n— The Ecrici team";
  return "https://wa.me/"+String(s.phone).replace(/\D/g,"")+"?text="+encodeURIComponent(t);
}
async function pvOpen(slug){
  const w=window.open("about:blank","_blank");
  const r=await api("/rest/v1/catalogs?slug=eq."+encodeURIComponent(slug)+"&select=data,updated_at,verified,created_at&limit=1");
  if(!r.ok||!Array.isArray(r.json)||!r.json.length){ if(w) w.close(); err="Could not load that page."; draw(); return; }
  lsSet("ecrici-pv",JSON.stringify({s:slug,t:Date.now(),r:r.json[0]}));
  const u="/shop.html?s="+encodeURIComponent(slug)+"&pv=1"; if(w) w.location.href=u; else location.href=u;
}
const pvBtn=s=>{ const pg=pages.find(p=>p.shop_id===s.id); return pg&&pg.slug?`<button data-pv="${esc(pg.slug)}">Preview page</button>`:""; };
const tpGet=()=>{ try{ return JSON.parse(lsGet("ecrici-tips")||"{}"); }catch(e){ return {}; } };
const tpMark=(slug,t)=>{ const o=tpGet(); o[slug]=t; lsSet("ecrici-tips",JSON.stringify(o)); };
function tipList(){
  if(!pgqOk) return [];
  const sent=tpGet(), out=[], now=Date.now();
  pages.forEach(p=>{
    if(!p.slug||!p.active||p.blocked||!p.phone) return;
    if(now-(+sent[p.slug]||0)<12096e5) return;
    const q=pgq[p.slug]; if(!q) return;
    const its=Array.isArray(q.items)?q.items.filter(x=>x&&x.n):[], n=its.length, ph=its.filter(x=>x.i).length, gal=Array.isArray(q.gal)?q.gal.length:0;
    const imp=[], min=[];
    if(n===0) imp.push(["items0"]); else if(n<3) imp.push(["items",n]);
    if(ph===0&&gal===0) imp.push(["photos"]); else if(n>=3&&["shop","electronics","food"].includes(q.biz)&&ph/n<.5) imp.push(["photos2"]);
    if(!p.logo) imp.push(["logo"]);
    if(!p.city) imp.push(["city"]);
    if(!q.cover) min.push(["cover"]); if(!(q.tag||"").trim()) min.push(["tag"]); if(!(q.hrs||"").trim()) min.push(["hrs"]);
    if(!imp.length&&min.length<2) return;
    out.push({p,gaps:imp.concat(min),imp:imp.length});
  });
  return out.sort((a,b)=>b.imp-a.imp||b.gaps.length-a.gaps.length);
}
const TPN={items0:["no products or services yet","aucun produit ou service"],items:["only a few items","très peu d'articles"],photos:["no photos","pas de photos"],photos2:["many items without photos","beaucoup d'articles sans photo"],logo:["no logo","pas de logo"],city:["no city set","ville non choisie"],cover:["no cover photo","pas de photo de couverture"],tag:["no short message","pas de petit message"],hrs:["no opening hours","pas d'horaires"]};
function tipLink(p,gaps){
  const fr=FRC.includes(String(p.country||"").toUpperCase()), nm=(p.name||"").trim()||(fr?"":"there"), u=location.origin+"/s/"+encodeURIComponent(p.slug);
  const L=g=>{ const k=g[0]; return fr?({items0:"Ajoutez vos premiers produits ou services : nom, prix et une photo",items:"Ajoutez plus d'articles : vous en avez "+g[1]+", visez 10 ou plus",photos:"Ajoutez des photos : les pages avec photos reçoivent beaucoup plus de messages",photos2:"Ajoutez une photo à chaque article",logo:"Ajoutez votre logo",city:"Choisissez votre ville pour apparaître dans « Près de moi »",cover:"Ajoutez une photo de couverture",tag:"Écrivez un petit message d'accroche",hrs:"Indiquez vos horaires"})[k]:({items0:"Add your first products or services: name, price and a photo",items:"Add more items: you have "+g[1]+", aim for 10 or more",photos:"Add photos: pages with photos get many more messages",photos2:"Add a photo to each item",logo:"Add your logo",city:"Choose your city so you show up in \"Near me\"",cover:"Add a cover photo",tag:"Write a short welcome message",hrs:"Add your opening hours"})[k]; };
  const lines=gaps.slice(0,6).map(g=>"✅ "+L(g)).join("\n");
  const t=fr?
    "Bonjour "+nm+" 👋\n\nC'est l'équipe Ecrici. Nous avons regardé votre page :\n"+u+"\n\nPour recevoir plus de clients, voici ce qui peut l'améliorer :\n"+lines+"\n\nComment faire : ouvrez Ecrici › Réglages › Ma page en ligne. Cela prend 5 minutes.\n\nBesoin d'aide ? Répondez ici, je vous guide pas à pas. 😊\n— L'équipe Ecrici"
   :"Hello "+nm+" 👋\n\nThis is the Ecrici team. We had a look at your page:\n"+u+"\n\nTo get more customers, here is what would improve it:\n"+lines+"\n\nHow: open Ecrici › Settings › My online page. It takes 5 minutes.\n\nNeed help? Reply here and I'll guide you step by step. 😊\n— The Ecrici team";
  return "https://wa.me/"+String(p.phone).replace(/\D/g,"")+"?text="+encodeURIComponent(t);
}
function vTips(){
  if(!pgqOk) return "";

  const row=({p,gaps})=>`<div class="card"><div class="item"><div class="av">${esc(ini(p.name||p.slug))}</div><div class="grow"><div class="name">${esc(p.name||p.slug)}</div><div class="muted">Missing: ${esc(gaps.slice(0,4).map(g=>TPN[g[0]][0]).join(", "))}${gaps.length>4?" +"+(gaps.length-4):""}</div></div></div><div class="row"><a class="b p" data-tp="${esc(p.slug)}" href="${esc(tipLink(p,gaps))}" target="_blank" rel="noopener">Send tips on WhatsApp</a><button data-tn="${esc(p.slug)}">Not now</button></div></div>`;
  return `<h2>Improve live pages (${L.length})</h2><div class="muted">These pages are missing things that bring customers. The message lists exactly what each one needs.</div>`+L.slice(0,4).map(row).join("")+(L.length>4?`<details><summary>Show ${L.length-4} more</summary>${L.slice(4).map(row).join("")}</details>`:"");
}
const ndGet=()=>{ try{ return JSON.parse(lsGet("ecrici-nudged")||"{}"); }catch(e){ return {}; } };
const ndMark=(id,n)=>{ const o=ndGet(); o[id]=Math.max(+o[id]||0,+n||1); lsSet("ecrici-nudged",JSON.stringify(o)); };
const VIDX={en:"https://youtube.com/shorts/5k079559RYE",fr:"https://youtube.com/shorts/ATNx7UAs8B8"};
function nudgeList(){
  const sent=ndGet(), out=[];
  shops.forEach(s=>{
    if(!s.phone||s.status==="suspended"||state(s)==="pending"||!s.created_at) return;
    const age=Math.floor((Date.now()-new Date(s.created_at).getTime())/864e5); if(age<1||age>30) return;
    const a=actv[String(s.id)]||{}, pr=+a.products||0, sl=+a.sales||0; if(sl>0) return;
    const step=age>=7?7:age>=3?3:1; if((+sent[s.id]||0)>=step) return;
    out.push({s,age,step,pr});
  });
  return out.sort((x,y)=>y.age-x.age);
}
function nudgeLink(s,step,pr){

  let t;
  if(step===1) t=fr?
    "Bonjour "+nm+" 👋\n\nC'est l'équipe Ecrici. Merci d'avoir créé votre compte ! 🙏\n\n"+(pr>0?"Vos produits sont bien enregistrés. Prochaine étape : enregistrez votre première vente, cela prend 1 minute.":"Le plus simple pour commencer : ouvrez ecrici.com, appuyez sur Ajouter et enregistrez votre premier produit ou service (1 minute).")+"\n\nUn blocage ? Répondez ici, je vous aide pas à pas. 😊\n— L'équipe Ecrici"
   :"Hello "+nm+" 👋\n\nThis is the Ecrici team. Thank you for creating your account! 🙏\n\n"+(pr>0?"Your products are saved. Next step: record your first sale, it takes 1 minute.":"The easiest way to start: open ecrici.com, tap Add and enter your first product or service (1 minute).")+"\n\nStuck on something? Reply here and I'll help you step by step. 😊\n— The Ecrici team";

  else { const base=(s.status==="active"&&s.paid_until&&s.paid_until>today())?s.paid_until:today(); body={status:"active",paid_until:addTo(base,a)}; if(s.referred_by&&!s.ref_status&&a!=="trial") body.ref_status="due"; }
  const wasPending=state(s)==="pending"; const prevVals={}; Object.keys(body).forEach(k=>{ prevVals[k]=(s[k]===undefined?null:s[k]); }); err=""; msg=""; msgLink="";
  const r=await api("/rest/v1/shops?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{Prefer:"return=representation"},body});
  if(!r.ok||!Array.isArray(r.json)||!r.json.length){ err=r.status===401?"Session ended. Log in again.":"Not saved. This account may not be an admin (see the guide)."; draw(); return; }
  Object.assign(s,r.json[0]); if(isUndo) undoDel(id); else undoSet(id,prevVals); msg=(isUndo?"Restored: ":"Saved: ")+(s.name||s.phone); if(wasPending&&s.status==="active"&&s.phone){ msgLink=welcomeLink(s); wMark(s.id); } if(a==="mkt-on"&&!isUndo&&pageLink(s)) msgLink=pageLink(s); draw();
}
if(!CFG.url||/PASTE/.test(CFG.url+CFG.key)){ app.innerHTML=`<main><h1>Ecrici Admin</h1><div class="card"><p>config.js is not filled in yet.</p></div></main>`; }
else if(sess) load(); else login();
})();
